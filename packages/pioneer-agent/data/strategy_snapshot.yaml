building_priorities:
- key: building-upgrade
  topic: 建筑升级
  aliases:
  - 升建筑
  - 升级建筑
  - 城建升级
  priority: 95
  rationale: 建筑升级需要同时满足资源充足和前置条件满足。
  constraints:
  - 不同建筑的前置链和需求等级不同。
  source_ref: KB-RULE-BUILDING-002
- key: building-prerequisite
  topic: 建筑前置
  aliases:
  - 建筑前置条件
  - 升级前置
  - 前置建筑
  priority: 93
  rationale: 某项建筑能否升级，不只取决于资源，还取决于其他建筑等级或主城等级是否达到前置条件。
  constraints:
  - 实际前置链以游戏内当前建筑树配置为准。
  source_ref: KB-RULE-BUILDING-003
- key: building-main-city
  topic: 主城
  aliases:
  - 城主府
  - 主城建筑
  priority: 90
  rationale: 主城是多数城建解锁和章节推进的核心建筑之一。
  constraints:
  - 具体升级前置和资源消耗以当前版本建筑面板为准。
  source_ref: KB-RULE-BUILDING-001
land_risk_rules:
- key: combat-land
  topic: 攻占地块
  priority: 96
  signals:
  - 体力
  - 征兵
  - 打地
  - 攻占土地
  - 攻地
  - 队伍
  rule: 攻占地块前需要确认目标可达、队伍可出征，并评估战损是否可接受。
  constraints:
  - 高等级地块和远距离目标通常意味着更高风险与时间成本。
  source_ref: KB-RULE-COMBAT-001
- key: mech-land-exp-decay
  topic: 打地经验衰减
  priority: 92
  signals:
  - 体力机制
  - 打地经验
  - 推荐等级
  - 武将升级
  - 经验衰减
  - 越级打地
  - 降级打地
  rule: 判定依据为队伍中最低等级武将 vs 土地推荐等级。
  constraints:
  - 高级队打低级地无收益也不扣体力，用于清地刷资源。
  - 降级打地可节省体力但牺牲 20% 经验。
  source_ref: KB-MECH-LAND-001
- key: combat-land-level
  topic: 地块等级
  priority: 90
  signals:
