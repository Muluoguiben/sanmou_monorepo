[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pioneer-agent"
version = "0.1.0"
description = "Opening leaderboard automation agent for Sanmou."
requires-python = ">=3.11"
dependencies = [
  "sanmou-common",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "google-genai>=1.0",
  "Pillow>=10.0",
  "requests>=2.31,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
windows-bridge = [
  "dxcam>=0.3; platform_system == 'Windows'",
  "opencv-python>=4.8; platform_system == 'Windows'",
  "Pillow>=10.0; platform_system == 'Windows'",
  "pyautogui>=0.9; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
  "windows-capture>=2.0; platform_system == 'Windows'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pioneer_agent = ["config/*.yaml"]
