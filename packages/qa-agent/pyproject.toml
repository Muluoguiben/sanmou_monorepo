[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.1.0"
description = "Game knowledge Q&A agent for Sanmou."
requires-python = ">=3.11"
dependencies = [
  "sanmou-common",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "google-genai>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
# qa_agent.video.lineup_frame_extractor does a lazy `from PIL import Image`
# for the Bilibili lineup-frame workflow; not needed for core QA/KB tests.
video = [
  "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
