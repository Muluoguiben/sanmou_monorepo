# Bilibili AI 字幕 → 三谋专有名词规范化词典
#
# 词典只负责 B 站 AI ASR 同音/形近替换；游戏内别名走 knowledge_sources/profiles/*.yaml
# 里 hero/skill 的 aliases 字段，不要在这里重复。
#
# 维护规则：
# 1. 每条 entry 必须给 source（ASR 错字）+ canonical（KB 中的规范名）+ confidence。
# 2. 仅当 source 是 B 站 AI 字幕里反复出现且对应 canonical 在 knowledge_sources 已存在时录入。
# 3. 2 字 source（如「金汤」「百战」）默认置 require_token_boundary: true，
#    只允许在动词/名词独立位置替换；正字本身存在二义性的，写 manual_only: true，
#    normalizer 仅记录候选不替换，留人工审核。
# 4. 新增条目时附 example_video（BVID）方便回溯。

