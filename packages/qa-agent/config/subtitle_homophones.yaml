# 二义性 / 需人工 review 的同音模式（normalizer 只产生日志候选，不替换原文）
#
# 当前陈仓批次已无 ambiguous-only 项目（金汤/百战/穆路蛮 经用户确认升级为 exact）。
# 仅保留空列表占位，便于将来新增。
ambiguous: []

# 玩家黑话 / 队伍别名 / 主持人前缀 —— 只参与 fuzzy 邻域守卫，不作为替换目标。
#
# 用途：防止 ≥3-char fuzzy 把这些专有名称切坏。例如 `诸葛飞燕` 是一个真队名，
# 但 fuzzy 看到 3-char 窗口 `诸葛飞` 时会误判为 edit-dist-1 的 `诸葛瑾`，把
# `诸葛飞燕` 改成 `诸葛瑾燕`。把 `诸葛飞燕` 加进 protected_substrings 后，
# 邻域守卫看到 4-char 保护项在 ±2 窗口内出现，就 suppress 这次 fuzzy。
#
# 同理 `SP诸葛` / `神诸葛` 是主持人常用前缀，后面接任何字（和/是/拿/体/...）
# 都会被 fuzzy 误判，把它们整体保护可以一次性兜底。
#
# Note：solutions/lineups/*.yaml 里所有 topic+aliases 已经自动加入，不必在此重复。
# 这里只补 staging YAML / 转录稿里出现但 KB lineup 还没正式收录的玩家黑话。
