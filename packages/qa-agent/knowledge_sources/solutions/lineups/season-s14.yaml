- id: video-lineup-s14-simayi-haozhao-caopi-sanbaye
  domain: solution
  entry_kind: lineup_solution
  topic: S14 司马懿-郝昭-曹丕三霸业队
  aliases:
  - 司马懿郝昭曹丕
  - 三霸业组队
  - 郝昭司马懿队
  facts:
  - 三谋史上首个"三霸业组队"阵容（司马懿、郝昭、曹丕三张霸业武将同队）。
  - 战术核心：前四回合金城汤池+双冰令囤抵御，抵御溢出触发借刀，形成"无限抵御-无限借刀-无限谋击"循环。
  - 曹丕第四回合潜龙在渊偷智力终结比赛；未雨绸缪+鹰视狼顾是司马懿的奇谋杠杆。
  - 兵种盾兵：三盾对 >5% 当前兵力的伤害高优先级触发借刀，第四回合有增伤。
  - 步步为营可定向奶兵力最低的队友（通常是郝昭，他在该队较脆）。
  constraints:
  - 视频作者指出该队怕马超。
  - 阵容吃齐全战法配置，白板/低红难以拉满。
