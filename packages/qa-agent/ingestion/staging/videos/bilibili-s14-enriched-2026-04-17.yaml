  entry:
    id: video-lineup-s14-day2-zhuge-zhurong-menghuo-1-2
    domain: solution
    entry_kind: lineup_solution
    topic: S14 第二天 诸葛祝融孟获 1-2 开荒队
    aliases:
    - 诸葛祝融孟获
    - 诸满孟
    - 1-2开荒
    - 123开荒
    facts:
    - 小仔哥陈仓之围第二天实战：主力诸葛亮+祝融夫人+孟获，用 1-2 思路带二三队升级打 9 级地。
    - 配 123 阵容（一队完整主力 + 二队三队各一个拖经验的低级角色），体力保持 200。
    - 当二三队体力不够时切 113（一队带三队某低级角色+其他高级），继续打。
    - 实测 21 级三队从 21 级开始打 9 级地；战损一队 ~900、二队 ~500。
    - 一队 35 级以后，二三队等级不再关键。
    - 例：一队 21 级诸葛亮 + 24 级孟获配合，也能 1-2 打 9 级地。
    constraints:
    - 避免碰"干宁"（甘宁）类定点突破战法，否则最弱的被集火直接减员。
    - 简单 9 级地留给 123 正常打，困难 9 级地用 113 高配组合处理。
    source_type: manual_rule
    source_ref: BILIBILI:BV1KGdbBPEfx#0-472
