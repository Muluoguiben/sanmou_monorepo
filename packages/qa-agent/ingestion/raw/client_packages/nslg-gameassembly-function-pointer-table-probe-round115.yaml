next_static_targets:
- If continuing this branch, inspect only outside known CodeGenModule/CodeRegistration
  pointer runs that carry a registration, metadata, or global-metadata-function signal.
- Because dispatcher candidate pointer hits classify as known IL2CPP tables, continue
  toward protected metadata method-definition ownership before naming managed methods.
- Use Assembly-CSharp.dll CodeGenModule method pointer table as a registration-side
  table, not as proof of InitLuaEnv ownership.
- Do not repeat direct-call dispatcher tracing unless new indirect owner evidence
  appears.
limitations:
- Offline/static qword scan only; no runtime attach, live instrumentation, account
