sanitized_conclusions:
- Target LuaScripts/Data payloads and downloaded lua-patches are high entropy and
  all sizes checked are divisible by 16, which rules out plain Lua/source and makes
  simple compression/XOR unlikely.
- Direct standard decompression probes from Round 31 failed; this round adds block-size
  evidence consistent with AES or another 16-byte block transform.
- Game runtime uses IL2CPP with NSLGame.Patcher.GameUpdater.InitLuaEnv from RuntimeInitializeOnLoads.json;
  global-metadata.dat has a valid IL2CPP magic but protected/obfuscated header fields,
  so normal symbol recovery is blocked without metadata deobfuscation.
- GameAssembly exposes xlua exports including xlua_getloaders and xluaL_loadbuffer
  plus Unity TextAsset APIs, but no clear plaintext loader/decryptor method name or
  key string was found by raw string search.
- 'Next useful slice: recover/deobfuscate IL2CPP metadata or locate xrefs around xluaL_loadbuffer/TextAsset::get_bytes
  in GameAssembly to find the native call path that decrypts the 16-byte-aligned Lua
  payloads.'
- Il2CppDumper was executed through PowerShell and failed with invalid metadata, confirming
  the metadata protection blocker rather than a missing tool issue.
