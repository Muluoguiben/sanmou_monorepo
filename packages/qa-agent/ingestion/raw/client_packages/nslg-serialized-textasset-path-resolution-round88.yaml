limitations:
- Offline/static only; no live Frida, runtime attach, account data, credentials, or
  online protocol were used.
- This resolves LuaScripts path_id to exact TextAsset object offsets by AssetBundle
  container record plus catalog payload sha1 plus Round174 object layout.
- The encrypted SerializedFile metadata object table was not independently decrypted;
  this report avoids claiming metadata-table parser recovery.
- Encrypted payload bytes remain blocked pending native decoder or transform recovery
  and manual semantic review.
guardrails:
- offline/static extracted CAB and catalog evidence only; no live instrumentation,
  account data, or online protocol data is included
- absolute local paths are not persisted; only sanitized asset paths, path_ids, offsets,
  lengths, counts, and hashes are stored
- path_id/object_offset resolution is decoder-route evidence, not reviewed gameplay
  knowledge
- encrypted payload bytes remain blocked until decoder recovery and manual semantic
  review
