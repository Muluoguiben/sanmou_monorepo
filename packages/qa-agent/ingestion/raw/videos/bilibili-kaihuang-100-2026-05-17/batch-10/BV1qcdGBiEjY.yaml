  transcript_lines:
  - 有网友问
  - 为什么在古代私藏盔甲是死罪
  - 而私藏刀剑却可以呢
  - 就这么说吧
  - 古代禁甲不禁兵
  - 古代权贵蓄养私兵往往都是被默许
  - 但私藏三副铠甲就是死罪
  - 这其实是源于冷兵器时代的特殊逻辑
  - 铁甲可抵御80%冷兵器伤害
  - 而重甲部队更是能创造一敌50的战损
  - 比唐朝李世民3000
  - 玄甲军破敌10万就是典型案例
