source:
  video_id: BV1NJ4m1H7Wh
  title: 从核心选择你的抽卡规划（周瑜篇）【三国谋定天下】
  uploader: 小仔哥321
  source_url: https://www.bilibili.com/video/BV1NJ4m1H7Wh/
  description: '抽到周瑜后的抽卡规划省流版：在祸起黄巾卡包中捞吕蒙，张飞，随手再捞一下甄洛，然后all in雄姿英发卡包补红周瑜，以及捞一手黄盖，和小乔。有条件的话再去奇门八阵卡包捞鲁肃。

    配队一：周瑜 吕蒙 鲁肃（双羁绊）

    配队二：周瑜 徐盛 张飞

    配队三：周瑜 黄盖 小乔（双羁绊）'
  ai_summary: 关于《三国谋定天下》中周瑜的抽卡规划。周瑜作为没有排在T1级别的核心武将，但其技能机制和输出能力使其成为值得投资的角色。视频建议没有抽到香香的玩家可以考虑抽周瑜，并通过黄金卡包捞吕蒙、张飞和争论，最后ALL
    IN雄姿英发卡包以获取红周瑜和黄盖、小乔。周瑜的配队多样，包括周瑜、鲁肃、吕蒙队，以及周瑜、徐盛、张飞队和周瑜、黄盖、小乔队。其中，周瑜、黄盖、小乔队通过苦肉和黄盖的主战法，提升了队伍的输出和坦度。
  ai_outline:
  - title: 周瑜成核心，需队友配合，输出爆炸。
    part_outline:
    - timestamp: 1
      content: 讨论没有T1核心武将的抽卡规划
    - timestamp: 23
      content: 周瑜成为核心因为其跳出嘟嘟队的潜质，技能吃队友配合
    - timestamp: 73
      content: 建议抽卡顺序：吕蒙、张飞、黄盖、小乔，有条件捞鲁肃
    timestamp: 1
  - title: 周瑜抽卡规划，队伍搭配与技能介绍。
    part_outline:
    - timestamp: 140
      content: 周瑜可搭配徐盛张飞或黄盖小乔，前者功能性已介绍，后者有“苦肉”效果，提升黄盖肉度。
    - timestamp: 227
      content: 周瑜小乔队，周瑜提升小乔主动战法释放率，代价是小乔治疗率降低。
    - timestamp: 261
      content: 黄盖技能成功释放，获得高额减伤，为队伍提供保障。
    timestamp: 140
