source:
  video_id: BV1g8PNeYEvP
  title: S6·开荒实录——低红稳榜前三
  uploader: 铁血雕馋
  source_url: https://www.bilibili.com/video/BV1g8PNeYEvP/
  description: S6·开荒实录——低红稳榜前三
  ai_summary: S6开荒实录，重点介绍了低红玩家如何在开荒中稳居前三。作者分享了自己的开荒流程和思路，包括使用源源懂转左孙路，再转左蔡路的策略，以及详细的加点和阵法安排。同时，强调了土地难易表和阵容表的重要性，提醒玩家不要盲目选择难打的阵容。尽管在战斗中出现了一些小翻车，但玩家表示这是不可避免的，只需重新尝试即可。最终，玩家成功升级，准备继续游戏。玩家在寻找合适的武将和战场时，遇到了一些挑战，包括寻找特定的武将和战场。尽管遇到了一些困难，玩家仍然坚持寻找，最终成功地进行了开荒。视频中还介绍了装备和技能的搭配，以及如何在战斗中保持优势。最后，视频还提到了一些关于角色升级和技能点的建议。
  ai_outline:
  - title: 低红开荒稳榜前三，分享开荒实录与思路。
    part_outline:
    - timestamp: 1
      content: 貂蝉介绍开荒情况，提到在开荒两个小时后，个人排名第四，红度较低，分享开荒思路
    - timestamp: 13
      content: 详细讲解开荒流程，推荐使用特定阵容和加点，强调开荒一图流的重要性
    - timestamp: 30
      content: 分享开荒过程中的翻车经历，强调翻车后也能获得经验，影响不大
    timestamp: 1
  - title: 开荒实录，低红稳榜前三，抽卡建盟。
    part_outline:
    - timestamp: 621
      content: 张角提升大，前期任务无脑，反馈足
    - timestamp: 641
      content: 无子队伍消耗一级地到二级地体力，节省主力体力
    - timestamp: 769
      content: 空城计抽卡多，马腾白板王，一秒红利
    timestamp: 621
  - title: 玩家讨论游戏策略与充值问题。
    part_outline:
    - timestamp: 1202
      content: 讨论基因与充值比例，提到10万人民币
    - timestamp: 1235
      content: 讨论武将技能及阵容搭配
    - timestamp: 1302
      content: 提及词条对提成的影响，讨论游戏策略
    timestamp: 1202
  - title: 开荒实录，低红稳榜前三，刘烨翻车。
    part_outline:
    - timestamp: 1800
      content: 兄弟因为第一个接战的是孙策，先碰孙策，讨论开荒策略
    - timestamp: 2020
      content: 讨论武将数值和技能，赵云和典韦的反击率
    - timestamp: 2396
      content: 确认打的是刘烨，讨论开荒地点的选择
    timestamp: 1800
  - title: 低红稳榜前三，开荒实录。
    part_outline:
    - timestamp: 2401
      content: 视频中出现了一些歌词和自言自语，提到“妈的汗流浃背了”，可能表示打视频游戏时的紧张和努力。
    - timestamp: 2479
      content: 视频内容主要围绕如何在游戏中打刘烨，提到“尽可能的前面还是多找刘烨去打”，显示出对游戏的策略和技巧。
    - timestamp: 2997
      content: 视频中最后出现的歌词“我曾难自拔于世界之大”，可能表示对游戏的热爱和对世界的探索。
    timestamp: 2401
  - title: 开荒实录，低红稳榜前三。
    part_outline:
    - timestamp: 3102
      content: 队伍开荒稳当，装备可以慢慢积累，技能按照攻略来即可。
    - timestamp: 3406
      content: 等级提升后，六级地可以轻松拿下，队伍实力逐渐增强。
    timestamp: 3001
  - title: 低红开荒稳榜前三，19级打低红白板轻松过。
    part_outline:
    - timestamp: 3600
      content: 开荒实录，低红稳榜前三，低红开荒稳榜前三
    - timestamp: 3618
      content: 找刘烨开五，18级有概率翻，19级打基本没问题
    - timestamp: 4141
      content: 开荒结束，换陆逊稳稳开，家里低级地不着急
    timestamp: 3600
  - title: 低红稳榜前三，开荒实录，陆逊换人。
    part_outline:
    - timestamp: 4200
      content: 四级换陆逊，打四级地，再去打那个
    - timestamp: 4240
      content: 金印定向赵云典韦，优先把城内四级啃上去，城外六级不用管
    - timestamp: 4282
      content: 升到24级换陆逊，打七级地，避开徐晃
    timestamp: 4200
  - title: 低红阵容开荒稳居前三，运气与策略并存。
    part_outline:
    - timestamp: 5002
      content: 24级低红白板打七，左孙露几乎零损，运气好，出了俩邓艾
    - timestamp: 5120
      content: 25级闭眼打，攻略里有完整的挑选敌人表格，哪些强哪些弱
    - timestamp: 5189
      content: 打到29去打八，走菜路或孙路都很强，开荒没压力
    timestamp: 4801
  - title: 开荒稳榜前三，低红也能行。
    part_outline:
    - timestamp: 5404
      content: 金币购买建议，强调购买冰，其他资源也可，购买后可提升能力。
    - timestamp: 5443
      content: 三马开荒，左菜路可开六，20级陆逊可开六，三品一红马腾概率低。
    - timestamp: 5520
      content: 歌曲《魔镜魔镜》片段，表达变美的愿望。
    timestamp: 5404
  - title: 低红玩家稳榜前三，开荒实录分享。
    part_outline:
    - timestamp: 6000
      content: 无兵营打六级地风险高，但能打过。每赛季名将五折都要买。
    - timestamp: 6200
      content: 普通玩家建议提升赵云、典韦、司马懿，陆逊提升不大，因为他绑定左慈。
    - timestamp: 6528
      content: 典韦加反击率很强，抽到两个典韦，感觉很爽。开荒打刘烨，二队随便搭配。
    timestamp: 6000
  - title: S4评级T1，感觉超不过。
    part_outline:
    - timestamp: 6606
      content: S4的十点更新后，玩家立即开始开荒，作者对白丝公的评级为T1，认为它并不特别强大。
    - timestamp: 6617
      content: 作者认为，即使再打几块，提升也很大，认为自己无法超越对手。
    - timestamp: 6638
      content: 作者表示，感觉无法超越对手，歌词为West virginia ♪ New rich mountain ♪。
    timestamp: 6606
