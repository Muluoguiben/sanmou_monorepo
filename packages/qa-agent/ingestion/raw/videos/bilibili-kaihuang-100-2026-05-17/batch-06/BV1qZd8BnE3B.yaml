  title: subtitle-chunk-1
  transcript: null
  transcript_lines:
  - S14当前最强开荒攻略
  - 低红也能速通关
  - 首先在S14赛季里开服
  - 就会送一个鸡腿和20个书简
  - 因此如果你的屈服强度不是很高的话
  - 这边不建议你来二拖一
  - 以为你的体力是完全够用的
  - 其次就是开局的门客选择上建议选择移民
  - 因为前期的资源是发展的资本
  - 因此选择移民比选其他门客更实用
  - 其次在正式开荒时
  - 首先第一步先用随便的队伍如桃园
