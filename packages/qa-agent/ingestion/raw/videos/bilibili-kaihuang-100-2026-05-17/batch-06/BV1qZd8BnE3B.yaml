  transcript_lines:
  - 把内城的全部开到四级和完成前期的任务
  - 然后直接下阵换貂蝉
  - 南蛮
  - 注意这里不是置换
  - 然后按照54314的口诀来把队伍升到十级
  - 后来带相对应的战法
  - 貂蝉带折冲
  - 孟获带金城汤池
  - 祝融夫人带圣迪一强就可以稳定来开五了
  - 等到了17级左右就可以开六了
  - 如果你的祝融夫人是高洪的话
  - 15就可尝试开六
