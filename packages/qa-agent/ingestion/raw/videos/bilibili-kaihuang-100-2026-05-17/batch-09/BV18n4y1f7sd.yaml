  - 全图鉴
  - 玩家选择24级开外城的失败可以补刀
  - 孙大圣玩家选择25开外成的失败可以补刀
  - 首开七级的有下列三个阵容
  - 可以选择程普或于禁或真落四
  - 首开过后
  - 如果不能一遍过七级的
  - 建议回主城升级军营
