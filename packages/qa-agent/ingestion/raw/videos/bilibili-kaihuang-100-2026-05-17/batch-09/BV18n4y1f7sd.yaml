  title: subtitle-chunk-5
  transcript: null
  transcript_lines:
  - 所以各位追求稳定
  - 15级开五保证不翻车
  - 这样就可以拉开差距
  - 我们就这样刷五级的
  - 刷到20级后进入下一阶段
  - 注意这里要是主线让你屯田
  - 千万别用了
  - 后面会说首开五级的最简单阵容
  - 皇甫嵩加丁奉加简雍
  - 第二个阶段开六级的到开七级的为中期一
  - 在20级后开六
  - 注意一定20级开六满红白板
  ocr_lines: []
