  title: subtitle-chunk-3
  transcript: null
  transcript_lines:
  - 不要继承
  - 请点击武将右上角号
  - 下阵武将在上阵自己的开荒队三直接上阵
  - 五级的桃园孙大圣可以开外城三
  - 直至十级再去开内城的四级地
  - 平民别越级开地满红或者全图鉴
  - 可以自己尝试8.9级是否能过
  - 因为本人测试是拿新区零冲号测试容易翻车
  - 因为你会比野帝少三个技能
  - 我们追求稳定
  - 就会比别人多出20点翻车的体力以及经验
  - 徐盛文丑张颌八级尝试开四翻车
