  - 加上按照上述进度刷级
  - 此时大概约28级到30级之间
  - 可以考虑存40体力
  - 尝试对八级的发起挑战
  - 存40点体力是为了防止20点体力时翻车
  - 浪费体力
  - 首开八级的最简单的阵容
  - 张飞加华雄加文聘
