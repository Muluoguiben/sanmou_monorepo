  transcript_lines:
  - 第三阶段开七级的
  - 开八级地和主线任务的收尾阶段
  - 一
  - 这时翻车与没翻车的
  - 各位势力值会有明显的差距
  - 并且每个职业的不同势力值也会有差异
  - 这里取决于职业提供的资源
  - 来决定你是否会卡主线
  - 二贼寇打贼寇有两种玩法
  - 第一种盟里打不过八级贼寇的
  - 可以留着
  - 第二天跟大部队打八级贼寇
