  title: subtitle-chunk-11
  transcript: null
  transcript_lines:
  - 大部分人不必在乎第一天排行榜
  - 如果在意
  - 可以直接打六级贼寇获得资源
  - 但是会有几千的资源损失和经验损失
  - 如果第一天盟里打得过八级贼寇的
  - 可以选择蹭车打八级贼寇
  - 这样可以获得资源箱子和经验
  - 防止卡主线
  - 三军演这个一般开局就打
  - 打到打不过了就停手
  - 等升级至极限或者缺资源再打
  - 四
