  transcript_lines:
  - 徐盛文丑张颌九级尝试开四成功
  - 这里测试图放这里
  - 各位自行决断是否要撞
  - 首开四级地最简单阵容
  - 董习加皇甫
  - 嵩加王朗
  - 完全没输出
  - 四用一队将内城的拳打至四级后
  - 等级约为13~14之间
  - 此时我们可以准备开五
  - 满红氪佬可以自行选择12级开五
  - 当然这里不知道S2的D会更新成什么样
