  title: subtitle-chunk-2
  transcript: null
  transcript_lines:
  - 满红氪佬神行镇君
  - 整活其左
  - 我将开荒第一天分为三个阶段
  - 第一个阶段刚落地开五分为前期一
  - 刚落地时
  - 我们需要跟着主线任务走
  - 这里我们需要准备两套开荒阵容
  - 比如一队桃园队加二队无子桃园加火烧
  - 首先我们拿出第二队开荒阵容
  - 伍子将内城的全部开到三级后
  - 进入下一步二更换阵容
  - 不要继承不要继承
  ocr_lines: []
  visual_summary: B站 AI 中文字幕切片。
