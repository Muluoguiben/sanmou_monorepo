  transcript_lines:
  - 将内城的六级的刷至七级后
  - 体力差不多用完
  - 鸡腿差不多用完
  - 开始练二队六
  - 如何练二队之前的五子
  - 此时应该已经十级
  - 我们练二队只需要追求一个字稳
  - 所以二队重复上述操作
  - 开4~5级的即可
  - 不需要给鸡腿练完
  - 约为14~15级之间
  - 然后进入下一个阶段
