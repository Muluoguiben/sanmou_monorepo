  title: subtitle-chunk-7
  transcript: null
  transcript_lines:
  - 我们回到内城
  - 这里我们将内城的地开至六级后
  - 可以完成一次屯田来过主线任务
  - 青囊可以利用技能优势
  - 使用体力单继续刷等级留到七级的
  - 用三刷级
  - 在能保证过六级地后
  - 就是枯燥乏味的刷级开拓的过程
  - 当等级来到23~25之间时
  - 我们准备开七
  - 满红大佬可以选择23时尝试开外城
  - 七就算翻车也可以进行补刀
