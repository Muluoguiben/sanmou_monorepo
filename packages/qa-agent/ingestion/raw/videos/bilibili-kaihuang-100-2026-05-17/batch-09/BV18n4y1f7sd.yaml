  title: subtitle-chunk-1
  transcript: null
  transcript_lines:
  - 既然各位都已经玩过S1了
  - 我这里就不过多描述新手相的东西了
  - 主要是指导各位每个等级段该做什么
  - 至于鸡腿怎么用体力什么时候恢复自己
  - 游戏里可以看见哈
  - 与S1不同的是
  - 进入S20选的职业不可以在中途转职
  - 所以需要慎重考虑
  - 这里我给出选职业建议
  - 月卡微氪天宫青囊私仓
  - 具体看盟内安排
  - 全图鉴神行司仓
