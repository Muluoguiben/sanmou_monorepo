  transcript: null
  transcript_lines:
  - 19级开都会翻车
  - 除非你想用40点体力开
  - 这里注意我们首开六
  - 尽量找外城的地
  - 这样方便我们上第二次补刀
  - 如果翻车
  - 六级的我们找三个子将为守军的领地
  - 如果实在没有
  - 可以去找戴华雄的守军
  - 这两种是最好打的
  - 其他这里没有什么好注意的
  - 二能保证一遍稳过六级地后
