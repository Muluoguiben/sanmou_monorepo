- start_sec: 79.0
  end_sec: 100.0
  title: subtitle-chunk-4
  transcript: null
  transcript_lines:
  - 平均升2~4级就打一次军演
  - 军演失败两次就下去沉淀
  - 最后一点
  - 如果你是中高站
  - 并且还在世界杯这种区段
  - 还有大佬来收购九基地的情况下
  - 你可以率先拿下更多的九级地
  - 然后在上面建上营帐
  - 让大佬来拆
  - 这样的话大佬就能做到无损冲榜
  - 还能有不小的报酬
  - 前提一点
