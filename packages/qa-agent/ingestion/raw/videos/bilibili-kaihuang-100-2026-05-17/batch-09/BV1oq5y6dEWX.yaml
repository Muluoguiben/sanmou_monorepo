  title: subtitle-chunk-3
  transcript: null
  transcript_lines:
  - 化20级前使用的队伍
  - 在置换之前一定要注意吃满鸡腿
  - 后续清理内层4L五的时候可以用得上
  - 四资源合理分配
  - 由于三谋的职业系统和霸业进度
  - 在前四个小时没有资源和体力增长
  - 那么除了神行这个职业不会卡六级本以外
  - 其他的职业都是会卡本的
  - 这是正常现象
  - 各位无需多虑
  - 那么缺资源
  - 我们就去打军演以及过任务
  ocr_lines: []
