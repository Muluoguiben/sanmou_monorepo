  title: subtitle-chunk-1
  transcript: null
  transcript_lines:
  - 盘点三某主播都在用的开荒小技巧
  - 掌握最后一个
  - 让你实现财富自由
  - 一不要用主力开垦一升二
  - 内城地的一升二都不要用你的主力去打
  - 这样完全就是在浪费体力
  - 拿一赛季举例
  - 你可以用系统送的紫卡去打四块一升二
  - 然后下阵用主力去做2L三
  - 大部分橙卡五级都能开
  - 三级地都不会有太大的问题
  - 二落地观察地形
  ocr_lines: []
