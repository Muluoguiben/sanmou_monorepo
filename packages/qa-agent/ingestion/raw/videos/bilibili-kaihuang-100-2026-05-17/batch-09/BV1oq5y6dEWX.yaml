- start_sec: 27.0
  end_sec: 54.0
  title: subtitle-chunk-2
  transcript: null
  transcript_lines:
  - 我们要注意观察附近的5~7级地
  - 最好附近的六级地和七级地要居多一点
  - 这是你中后期升级冲榜的至关重要的一点
  - 防止开局被种死
  - 三鸡腿的合理分配
  - 在二赛季开始往后的所有赛季当中
  - 鸡腿在前期都尤为重要
  - 并且高手开荒都会用到两到三队
  - 分别是清杂队和20级之前使用的队伍
  - 和20级之后使用的队伍
  - 轻杂队一定要注意是下阵
  - 而不是置换呃
  ocr_lines: []
