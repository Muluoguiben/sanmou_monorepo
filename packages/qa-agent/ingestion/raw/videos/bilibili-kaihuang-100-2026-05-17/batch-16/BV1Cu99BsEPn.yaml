  - 赵云斗为什么需要调筒
  - 其实主要还是针对孙坚吗
  - 目前孙坚还是蛮多的
  - 赵云呢可以是队内的二筒
  - 也可以是队内的三筒
  - 赵云二筒的话
  - 那就不会被前锋吸属性
  - 但是后排三筒被斩将夺旗那个人会死的巨快
  - 少云三筒的话虽然会被填风吸属性
  - 但是能够抗住斩将夺旗的伤害
  - 这个呢就需要具体问题具体分析了
