  title: subtitle-chunk-3
  transcript: null
  transcript_lines:
  - 在皇马和好星火的选择上呢
  - 选择好星火
  - 接下来是本赛季最受大家喜爱的周瑜队伍
  - 配队的核心出装是风华加三匹渡
  - 皇马
  - 没有渡火马的话
  - 那也可以用司风掠水之类的异常马匹代替
  - 另一个细节是
  - 诸葛瑾和荀彧的速度呢都要拉到180
  - 荀彧一般要带风住火势去降属性
  - 很好理解
  - 而诸葛瑾需要拉到180一点
