  transcript_lines:
  - OKOK马上就是W10赛季的中心阶段啦
  - 那我们的六个幕僚位置呢也马上全解锁了
  - 最终版的W11
  - 无需手操共存的懒人六队共存
  - 也为大家准备好咯
  - 放在评论区自取
  - 诶以往的赛季我都会出八队共存
  - 为什么这个赛季最后只出了六对共存呢
  - 一是因为这个赛季呢总共只有六个幕僚的增益
  - 七八队本来质量就差
  - 没幕僚更是一坨
  - 二是这个赛季能有接近无限的传送
