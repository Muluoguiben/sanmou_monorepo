  title: subtitle-chunk-5
  transcript: null
  transcript_lines:
  - 而张宁比较红的朋友的一个选择
  - 这两套孙坚的细节都是需要控制
  - 左慈三筒
  - 田丰的话需要麻烦一点
  - 算一个磐石
  - 张宁对我就比较好调筒了
  - 只需要张宁带制筒的装备
  - 分肩带五仙的装备
  - 左慈少带一个统帅装备呢
  - 就能够达成张灵2~1统
  - 孙坚二筒
  - 左慈三筒了
