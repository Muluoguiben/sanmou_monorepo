  title: subtitle-chunk-6
  transcript: null
  transcript_lines:
  - 张领队如果给不出剑末的话呢
  - 也可以放在青卫队里面共存
  - 左慈带一个智人山刃就可以了
  - 这时候肯定就有人会问了
  - 诶
