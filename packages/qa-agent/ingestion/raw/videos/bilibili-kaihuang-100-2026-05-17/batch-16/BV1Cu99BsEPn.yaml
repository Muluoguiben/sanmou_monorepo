  title: subtitle-chunk-4
  transcript: null
  transcript_lines:
  - 速度比玄月快一点
  - 这是因为荀彧如果在指挥阶段发动了狂风大作
  - 让周瑜出伤了的话呢
  - 诸葛瑾的速度比荀彧快
  - 就能够让周瑜在出伤的时候呢就结上毒心
  - 接下来是孙坚体系
  - 孙坚当前有两个流派
  - 一个是右边的孙坚主C的左田间流派
  - 一个是左边的张宁主C的左肩灵流派
  - 其实单论强度来说
  - 那肯定是田丰孙坚比较强啊
  - 左杰林这套队伍呢只是说提供给孙坚不红
  ocr_lines: []
