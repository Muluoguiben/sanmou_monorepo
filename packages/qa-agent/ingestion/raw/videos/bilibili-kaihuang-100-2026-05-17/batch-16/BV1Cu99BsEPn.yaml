  title: subtitle-chunk-2
  transcript: null
  transcript_lines:
  - 还是非常容易把粮食打完的六队
  - 我觉得足够了
  - 那这一期呢我会讲所有主流队伍的细节
  - 助力大家在互刷期提升五训效率
  - 首当其冲的就是本赛季的霸业郝昭体系
  - 无论是左边的皇马还是右边的好心火
  - 郝昭体系的核心出装都是三个仙玉和两本冰令
  - 之前讲过郝昭的速度要拉到170
  - 那个时候呢是为了应对魏延
  - 但是目前的魏延几乎绝种了
  - 这个速度呢可加可不加
  - 另外补充一下
  ocr_lines: []
