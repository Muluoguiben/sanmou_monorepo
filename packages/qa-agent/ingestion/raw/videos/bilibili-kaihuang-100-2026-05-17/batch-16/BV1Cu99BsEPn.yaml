  - 加上幕僚的连击率
  - 加成呢在叠满之后是接近百分百的
  - 不太需要方圆阵的连击率
  - 并且方圆阵还没有增伤加成
  - 垃圾中的垃圾好吧
  - 正确的带法呢是孟获带碧奇瑞奇精装成员目录
  - 大王在战八方和无奈之至
  - 战八方都能够破抵御以及给10%的易伤
  - 末路大王不要御敌领先
  - 也不要出现乾坤了
  - 这10%的易伤至关重要
  - 最后是赵云体系
