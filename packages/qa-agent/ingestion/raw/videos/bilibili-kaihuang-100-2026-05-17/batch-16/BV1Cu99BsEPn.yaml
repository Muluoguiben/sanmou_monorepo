  title: subtitle-chunk-7
  transcript: null
  transcript_lines:
  - 再往下是蛮子体系
  - 蛮子体系目前主流呢是两个流派
  - 一个是右边的满配的六合蛮子
  - 一个是左边的降配共存的追击蛮子
  - 单论强度的话
  - 一定是给了芥末的这个满配蛮子强嘛
  - 烈火蛮子呢就没啥细节了
  - 飞机板子我看到目前很多都是错误的搭配
  - 随机蛮子正确搭配呢一定是畸形阵
  - 千万别用方圆阵了
  - 木大王阵前排一下就死了
  - 连击率有无奈之志
