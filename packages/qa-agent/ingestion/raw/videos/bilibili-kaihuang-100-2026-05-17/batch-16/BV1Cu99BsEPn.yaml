  - 赵云这个体系也值得细细说道说道
  - 首先赵云是高红专属
  - 而且不仅吃红
  - 还是赵云加甘夫人两个人的品
  - 每一行每一品都是质变
  - 满红白品强无敌低红别碰力宏
  - 如果实在要玩的话
  - 你就玩双核的照杆枪
  - 其次赵云只能绑定甘夫人
  - 玩锥形阵
  - 鱼鳞阵的伤害完全刮痧
