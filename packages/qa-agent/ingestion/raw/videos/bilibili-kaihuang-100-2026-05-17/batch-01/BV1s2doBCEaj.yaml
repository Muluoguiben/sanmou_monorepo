  transcript_lines:
  - 开荒新手期结束以后
  - 队伍共存怎么选
  - 主播给大家推荐两个选择
  - 一个是刚满红版本的三队共存
  - 还有一个是中版本的两对共存
  - 先看一下刚满红版本的主播控的这个号
  - 目前是这个区的总榜第一
  - 我给他准备了三对共存
  - 第一队是蛮子
  - 第二队是星火枪
  - 第三队是左孙宁
  - 这三个队伍有一些战法是拆着用的
