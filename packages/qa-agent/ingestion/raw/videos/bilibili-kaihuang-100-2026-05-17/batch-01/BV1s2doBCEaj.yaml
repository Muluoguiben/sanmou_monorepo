  transcript_lines:
  - 武将置换的话
  - 体力会按照低的那个武将来
  - 所以这边我把122队的体力控的差不多
  - 早上的话还是用他们正常开
  - 等到中午的时候把貂蝉和SP诸葛置换一下
  - 打个远征再置换回来
  - 到时候置换而不会亏多少
  - 就亏个两点
  - 完全可以接受
  - 这边也附带给大家看一下打远征的阵容
  - 全红渡通用诸葛蛮战法
  - 这边个人感觉诸葛亮带攻城会更好一点
