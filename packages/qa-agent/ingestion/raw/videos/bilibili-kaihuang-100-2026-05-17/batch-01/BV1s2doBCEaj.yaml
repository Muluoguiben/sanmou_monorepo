  transcript_lines:
  - 远征Buff的优先级就是备注里面从左到右的顺序
  - 如果你有完毕装备的话
  - 最好是先给诸葛亮
  - 因为这三个人里面一般是SP诸葛最先使
  - 还有一点
  - 打远征的时候
  - 韬略是可以边打边洗的
  - 就是你一开始可能书简不够
  - 韬略洗的不好
  - 但是打到一半的时候拿到一部分书简了
  - 可以先把韬略再完善一下
  - 再接着打
