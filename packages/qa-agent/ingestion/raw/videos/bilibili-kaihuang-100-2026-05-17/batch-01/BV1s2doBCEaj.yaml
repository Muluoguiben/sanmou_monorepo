  transcript_lines:
  - 可以把第一队的一些战马直接拆过来
  - 星火枪这队加点全部推荐加点就好了
  - 然后第三队这边战法搭配是这样子的
  - 加点的话
  - 左慈张灵加智力
  - 瞬间这边加30点
  - 先攻打后加武力
  - 这三对共存是最省兵力的打法
  - 然后有个小细节
  - 因为我们明天打远征的话
  - 还是要用诸葛马比较好
  - 但是过了新手期以后
