  transcript_lines:
  - 2分钟带你速通三毛W11赛季开荒全程干货
  - 带你做好开荒规划
  - 首先本赛季的开荒阵容和流程
  - 与前几个赛季一样
  - 只是多出了一个门客功能
  - 门客的功能与种类有很多
  - 但在开荒期我们能用到门客只有几个
  - '4.1'
  - 6250后开局出门客就能升到名望二级
  - 解锁门客的第二个槽位
  - 这里我们除了开局送的域名不便之外
  - 中红及以上的玩家无脑选择作家无损置换资源
