  transcript_lines:
  - 可以快速帮我们过掉地图上的珍珠锁任务
  - 解锁空地低
  - 红白的玩家呢可以选择教头拿储备经验
  - 提升我们二战队的等级
  - 更早的使用一拖二的方式抢到解基地
  - 除此之外
  - 还可以选择油真
  - 用来降低九级手铺的是卖给盟里面的大佬
  - 然后再来看下开荒流程以及阵容
  - 落地后
  - 用我们三队打掉内存
  - 四块二级地下阵
  ocr_lines: []
  visual_summary: B站 AI 中文字幕切片。
