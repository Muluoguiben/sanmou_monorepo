  title: subtitle-chunk-4
  transcript: null
  transcript_lines:
  - 后续7~9级地的首开阵容与前面赛季一样
  - 依旧是左田打邓艾城
  - 5~25级换丸子
  - 我们可以尝试在26级无兵硬的情况下面
  - 去首开内城的张飞和黄忠八级D
  - 然后屯田
  - 这里建议除非蛮子的平均红度低于三红
  - 不然都是去屯八级的内存地
  - 体力不够的情况
  - 下面呢可以考虑囤一次七过章节任务
  - 拿鸡腿
  - 后续的九级地找甘宁
