  title: subtitle-chunk-3
  transcript: null
  transcript_lines:
  - 换上一队掉伞蛮子打内存
  - 五块三级地
  - 一块四级地升到十级下阵
  - 换上我们最开始的战队呢
  - 再将内存
  - 其余的七块四级地全部打掉过任务开局完成
  - 随后我们一队貂蝉十级开五满
  - 红16级开六中级
  - 红17~18级开六
  - 20级后呢
  - 可以直接用蛮子清将军演打通关
  - 再换上左甜甜开希
  ocr_lines: []
