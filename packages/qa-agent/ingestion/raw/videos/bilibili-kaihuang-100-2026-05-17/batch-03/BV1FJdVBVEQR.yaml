  title: subtitle-chunk-4
  transcript: null
  transcript_lines:
  - 首先我们将三名开荒的主力武将
  - 各自随便找一名五级的武将进行等级置换
  - 这个时候三名武将是缺体力的不健康状态对吧
  - 在新手阶段存在保护机制
  - 比如我们可以直接用五级零体力的祝融
  - 与满体力的司马懿进行置换
  - 可见司马懿的200体力
  - 是可以过渡到祝融夫人身上的
  - 但是由于同等级无法置换
  - 那么我们就可以找三名满体力的武将配成一对
  - 比如桃园霸王弓三宝等等
  - 升级战法后
