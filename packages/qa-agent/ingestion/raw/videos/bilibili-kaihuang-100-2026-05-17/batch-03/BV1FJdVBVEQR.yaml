  transcript_lines:
  - 和传统打五块三级地
  - 一块四级地
  - 达到十级则需要消耗70体力
  - 简单来说就是拖带式开荒
  - 具备30点体力优势
  - 但是从视频可见
  - 这个号先是在十级尝试二拖一失败
  - 然后12级再尝试二拖一依然失败
  - 这个时候就已经浪费非常多体力了
  - 直接继续开荒
  - 肯定会大幅度落后节奏的
  - 那么我们应该怎么办呢
