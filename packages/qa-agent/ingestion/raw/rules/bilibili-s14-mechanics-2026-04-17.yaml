- id: mech-haozhao-ciyu
  domain: hero
  entry_kind: generic_rule
  topic: 郝昭的四个统帅词条与金书机制
  aliases:
  - 郝昭词条
  - 郝昭机制
  - 千机重城
  - 巍然不动
  facts:
  - 郝昭有四个受统帅加成的词条，第四个藏在金书里。
  - 金书机制——消除敌方谋略减伤；若对面没有谋减则直接转化为易伤，与曹丕形成完美联动。
  - 巍然不动（郝昭词条）——我军全体每消耗两次抵御触发借刀伤害，是该队抵御溢出循环的起点。
  - 千机重城（郝昭自带，官方描述）——我军全体行动时 30%->60% 概率（受统率影响）获得 1 层抵御；若其兵力低于 50%，额外有 25%->50% 概率再获得 1 层抵御。
  - 看似短板的"兵力 < 50% 判定"恰恰是司马懿连战掉兵后持续触发抵御的核心：每场战斗兵力下降 → 下场更易叠额外抵御。
  - 抵御层数在该队可以溢出（不浪费），配合巍然不动就是越打抵御越多、抵御越多借刀越多的正反馈。
  constraints:
  - 额外抵御的触发上限官方给 50%，作者认为实战体感偏高。
  source_type: manual_rule
  source_ref: BILIBILI:BV1aeQnB3Ehw#0-290
  updated_at: '2026-04-17'
  confidence: 0.85
