  - 郝昭
  - 司马懿
  - 曹丕
  - 抵御
  - 借刀
  - 金书
  priority: 78

- id: mech-simayi-yuezhanyueyong
  domain: hero
  entry_kind: generic_rule
  topic: 司马懿越战越勇连战机制
  aliases:
  - 司马懿越战越勇
  - 司马懿连战
  facts:
  - 过去认为司马懿连战差、战损大；郝昭到位后这变成优势。
  - 若出门 3 万兵、打完剩 2.2 万（约 73%），进入下一战兵力低于 50%（1.5 万）时可稳定触发千机重城的额外抵御。
  - 兵力越低 → 千机重城额外抵御触发越稳 → 抵御/借刀循环越猛，所以司马懿在该队巴不得兵力低。
  constraints:
  - 该机制依赖队友抵御链（郝昭巍然不动 + 曹丕/步步为营）配齐，单带司马懿效果不成立。
  source_type: manual_rule
  source_ref: BILIBILI:BV1aeQnB3Ehw#290-487
  updated_at: '2026-04-17'
