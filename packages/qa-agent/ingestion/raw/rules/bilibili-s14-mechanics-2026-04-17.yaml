  topic: S14 陈仓之围第一天开 9 级地的红度-等级对应
  aliases:
  - S14开9等级
  - 陈仓之围开9红度
  - 开9红度对应表
  facts:
  - 满红 30 级可开 9（抢榜 29 级开局）。
  - 高红 31 级可开 9。
  - 中红 32 级可开 9。
  - 低红/白板第一天不建议开 9；第二天解锁雁行阵后 33 级可开 9（32.5 级也接近）。
  - 该表对应第一天首发阶段，第二天门槛会下降 1-2 级。
  constraints:
  - 依赖核心装备/战法配齐，词条不全时实际等级门槛会上升。
