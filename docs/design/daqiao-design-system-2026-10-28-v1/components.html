<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大乔设计规范 组件样板</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><script src="lucide.js" defer></script></head>
<body><div id="ds-root"></div>
<script>
const icon=(name,cls='')=>`<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
const button=(label,cls='',extra='')=>`<button type="button" class="dq-button ${cls}" ${extra}>${label}</button>`;
const caption=text=>`<span class="caption">${text}</span>`;
const section=(title,subtitle='')=>`<div class="section-heading"><h2>${title}</h2>${subtitle?caption(subtitle):''}</div>`;
const views={
foundations:()=>`<div class="foundation-grid"><section class="board typography">${section('文字层级','所有尺寸均为 CSS px')}<div class="type-sample"><div class="spec">页面标题 · 24 / 32 · 600</div><div class="type-title">今天先做重要的事</div></div><div class="type-sample"><div class="spec">区域标题 · 20 / 28 · 600</div><div class="type-section">我的任务</div></div><div class="type-sample"><div class="spec">小标题 · 16 / 24 · 600</div><div class="type-subhead">长风 · S1</div></div><div class="type-sample"><div class="spec">消息正文 · 15 / 26 · 400</div><div class="type-body">已为你整理当前进度，下一步先完成章节目标。</div></div><div class="type-sample"><div class="spec">按钮与控件 · 14 / 20 · 500</div><div class="type-control">查看任务　保存设置</div></div><div class="type-sample"><div class="spec">辅助信息 · 13 / 20 · 400</div><div class="type-secondary">更新于 09:14 · 所有账号状态分别保存</div></div><div class="type-sample"><div class="spec">注释与时间 · 12 / 18 · 400</div><div class="type-caption">示例内容 · 不连接真实游戏</div></div></section><section class="board palette">${section('颜色与表面','背景柔和，信息清晰')}<div class="swatch-grid">${[['primary','主要操作','#476D89'],['text-primary','主要文字','#31495B'],['text-secondary','辅助文字','#52697A'],['text-muted','次要信息','#607487'],['surface','内容表面','#FFFFFF'],['surface-soft','轻交互底色','#E7F0F6'],['surface-user','用户消息','#CEDFE9'],['border-control','控件边界','#6D8394']].map(([token,label,hex])=>`<div class="swatch"><div class="swatch-color" style="background:var(--dq-${token})"></div><strong>${label}</strong><code>${hex}</code></div>`).join('')}</div><div class="gradient-sample">雾蓝 → 暖白<small>#DCE8F1 · #EAF0F3 · #F4EEE7</small></div><div class="semantic-row"><span class="status success">${icon('circle-check')}已完成</span><span class="status warning">${icon('clock-3')}等待中</span><span class="status danger">${icon('circle-alert')}连接失败</span></div><p class="caption">状态同时使用文字和符号，不只依赖颜色。</p></section></div><div class="bottom-grid"><section class="board spacing">${section('间距','4px 基础单位')}<div class="space-scale">${[4,8,12,16,20,24,32,40,48].map(n=>`<div><span class="space-bar" style="width:${n}px"></span><code>${n}</code></div>`).join('')}</div><p class="caption">图标与文字 8px · 组件内部 12–16px · 卡片内边距 24px · 页面边距 32px</p></section><section class="board radii">${section('圆角','按组件层级使用')}<div class="radius-row">${[['xs','8'],['sm','12'],['md','16'],['lg','20'],['xl','24'],['pill','∞']].map(([key,n])=>`<div><span style="border-radius:var(--dq-radius-${key})"></span><code>${n}</code></div>`).join('')}</div></section></div>`,
controls:()=>`<section class="board buttons-board">${section('按钮','主要按钮 36px · 小按钮 32px · 大按钮 44px')}<div class="button-states">${[['默认',button('保存设置','primary')],['悬停',button('保存设置','primary is-hover')],['按下',button('保存设置','primary is-pressed')],['键盘聚焦',button('保存设置','primary is-focus')],['加载中',button(icon('loader-circle')+'正在验证','primary is-loading','disabled')],['不可用',button('保存设置','primary','disabled')]].map(([label,markup])=>`<div>${markup}${caption(label)}</div>`).join('')}</div><div class="button-types"><div>${button(icon('plus')+'添加服务','secondary')}${caption('次按钮')}</div><div>${button('返回对话','ghost')}${caption('文字按钮')}</div><div>${button(icon('trash-2')+'删除服务','danger')}${caption('危险操作')}</div><div>${button(icon('settings'),'icon-button','aria-label="设置示例"')}${caption('图标按钮 36 × 36')}</div><div>${button('测试加载效果','secondary','data-load')}${caption('点击查看本地交互')}</div></div></section><div class="controls-grid"><section class="board fields-board">${section('输入控件','标签常驻，不用占位符代替标签')}<div class="field-grid"><label>服务名称<input value="我的云端服务" aria-label="服务名称示例"></label><label>当前聚焦<input class="is-focus" value="我的本地模型" aria-label="聚焦输入示例"></label><label>校验失败<input class="is-error" value="" placeholder="请输入服务名称" aria-invalid="true" aria-describedby="sample-error"><span id="sample-error" class="field-error">${icon('circle-alert')}服务名称不能为空</span></label><label>不可修改<input value="正在使用的策略版本" disabled></label><label class="full">服务位置<select aria-label="服务位置"><option>云端 API</option><option>本机／局域网</option></select></label></div></section><section class="board choice-board">${section('选择与切换','原生语义，清楚显示当前状态')}<div class="switch-row"><label for="dev-switch"><strong>Dev 调试</strong><span>开启后显示详细运行记录</span></label><input id="dev-switch" class="switch" type="checkbox" role="switch" aria-label="Dev调试示例"></div><div class="check-row"><label><input type="checkbox" checked>允许参与自动分配</label><label><input type="checkbox">保存为备用服务</label></div><div class="sample-tabs" role="tablist" aria-label="组件示例页签"><button type="button" id="tab-chat" role="tab" aria-selected="true" aria-controls="tab-panel" data-tab="chat">对话</button><button type="button" id="tab-tasks" role="tab" aria-selected="false" aria-controls="tab-panel" data-tab="tasks">任务</button></div><div id="tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-chat">与大乔讨论目标、发送资料、调整安排。</div><div class="focus-note">${icon('keyboard')}Tab 移动焦点，Enter／空格操作；页签支持方向键。</div></section></div><div class="interaction-feedback" data-feedback aria-live="polite">组件交互仅改变本页示例，不读取文件或调用 API。</div>`,
patterns:()=>`<div class="pattern-grid"><section class="board chat-pattern">${section('聊天与附件','文字、图片、文件，无语音入口')}<div class="message user-message">先推进章节，第二队阵容晚点再调整。</div><div class="message assistant-message">好，先处理章节任务。阵容调整已追加，我会结合当前进度安排顺序。</div><div class="composer"><div class="attachment">${icon('image')}<span>阵容截图.png<small>待发送</small></span><button type="button" class="remove-attachment" data-remove aria-label="移除示例附件">${icon('x')}</button></div><textarea aria-label="示例消息草稿" placeholder="和大乔聊聊，或粘贴图片、文件…"></textarea><div class="compose-footer"><button class="dq-button icon-button ghost" type="button" aria-label="添加附件示例">${icon('paperclip')}</button><span>模型：自动分配</span><button class="dq-button icon-button primary" type="button" data-send aria-label="发送示例消息">${icon('arrow-up')}</button></div></div></section><section class="board task-pattern">${section('任务与状态','分组统计和状态统一为 88px 列')}<div class="task-group"><div class="task-head"><strong>长风 · S1</strong><span>2 项未完成</span></div><div class="task-row"><span>完成第三章任务<small>正在核对建筑升级结果</small></span><span class="task-state running">进行中</span></div><div class="task-row"><span>调整第二队阵容<small>新任务默认追加</small></span><span class="task-state waiting">排队中</span></div></div><div class="alignment-label"><span>名称与说明左对齐</span><span>88px</span></div><div class="status-wrap"><span class="status success">${icon('circle-check')}已完成</span><span class="status warning">${icon('circle-help')}待确认</span><span class="status neutral">${icon('pause')}已暂停</span></div><p class="caption">颜色是辅助；状态标签不混用不同宽度和不同对齐方式。</p></section></div><section class="board icons-board">${section('图标','Lucide · 24 × 24 画布 · 2px 线宽 · 默认显示 20px')}<div class="icon-grid">${[['message-square','对话'],['list-todo','任务'],['settings','设置'],['paperclip','附件'],['image','截图'],['copy','复制'],['pause','暂停'],['play','继续'],['x','关闭'],['arrow-up','发送'],['chevron-down','展开'],['bug','调试']].map(([name,label])=>`<div>${icon(name)}<span>${label}</span><code>${name}</code></div>`).join('')}</div><div class="icon-sizes"><span>${icon('settings','size-sm')}16px · 行内</span><span>${icon('settings')}20px · 工具栏</span><span>${icon('settings','size-lg')}24px · 强调入口</span><span>图标按钮的点击区域独立于图标尺寸。</span></div></section><div class="interaction-feedback" data-feedback aria-live="polite">可移除附件、编辑消息并点击发送，均为本地交互示例。</div>`
};
function render(){const requested=location.hash.slice(1)||'foundations';const id=Object.hasOwn(views,requested)?requested:'foundations';document.getElementById('ds-root').innerHTML=`<div id="ds-app" data-view="${id}"><header class="page-header"><div class="brand"><span class="brand-mark">乔</span><div><strong>大乔设计规范</strong><small>白蓝渐变 · 组件样板 v1</small></div></div><nav aria-label="设计规范分类">${[['foundations','基础规范'],['controls','控件与状态'],['patterns','组合与图标']].map(([key,label])=>`<a href="#${key}" ${key===id?'aria-current="page"':''}>${label}</a>`).join('')}</nav><span class="draft-mark">评审稿</span></header><main>${views[id]()}</main><footer>设计样板 · 示例数据 · 规范数值与 tokens.css 保持一致</footer></div>`;window.lucide?.createIcons({attrs:{width:20,height:20,'stroke-width':2}});bind();}
function bind(){const feedback=document.querySelector('[data-feedback]');document.querySelector('[data-load]')?.addEventListener('click',event=>{const b=event.currentTarget;if(b.disabled)return;b.disabled=true;b.textContent='正在验证…';if(feedback)feedback.textContent='正在演示加载状态，不发送真实请求。';setTimeout(()=>{b.disabled=false;b.textContent='测试加载效果';if(feedback)feedback.textContent='加载示意完成。真实产品必须根据实际结果显示成功或失败。';},900);});document.querySelectorAll('[data-tab]').forEach(b=>{b.addEventListener('click',()=>activateTab(b));b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[data-tab]')],next=tabs[(tabs.indexOf(b)+1)%tabs.length];next.focus();activateTab(next);});});document.getElementById('dev-switch')?.addEventListener('change',e=>{if(feedback)feedback.textContent=e.target.checked?'Dev 开启示意：正式产品显示调试 Tab。':'Dev 关闭示意：隐藏调试 Tab，不删除日志。';});document.querySelector('[data-remove]')?.addEventListener('click',e=>{e.currentTarget.closest('.attachment').remove();if(feedback)feedback.textContent='附件已从草稿移除，未删除任何本地文件。';});document.querySelector('[data-send]')?.addEventListener('click',()=>{const t=document.querySelector('textarea');if(!t.value.trim()&&!document.querySelector('.attachment')){if(feedback)feedback.textContent='请先输入文字或添加附件。';return;}t.value='';document.querySelector('.attachment')?.remove();if(feedback)feedback.textContent='发送交互示意完成，未上传文件或调用模型。';});}
function activateTab(button){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));const panel=document.getElementById('tab-panel');panel.setAttribute('aria-labelledby',button.id);panel.textContent=button.dataset.tab==='chat'?'与大乔讨论目标、发送资料、调整安排。':'查看各账号任务、执行过程与定时简报。';}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',render);
</script></body></html>
