<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>大乔 PRD 设计样图</title><link rel="stylesheet" href="mockups.css"></head><body><div id="root"></div>
<script>
const paths=['chat','account','tasks','task-detail','models','add-service','brief','dev','binding','account-rules'];
const btn=(text,href,cls='')=>`<a class="btn ${cls}" href="#${href}">${text}</a>`;
const heading=(title,desc,extra='')=>`<div class="page-title"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`;
const composer=(attachments=false)=>`<div class="composer">${attachments?'<div class="attachment-row"><div class="attachment">▧ <span>阵容截图.png<small>图片 · 待发送</small></span><span>×</span></div><div class="attachment">▤ <span>开荒笔记.md<small>文件 · 待发送</small></span><span>×</span></div></div>':''}<div class="composer-text">${attachments?'结合这张截图和笔记，帮我安排下一步。':'和大乔聊聊，或粘贴文字、图片、文件…'}</div><div class="composer-bottom"><div class="composer-tools"><span class="plus">＋</span><span>模型：自动分配</span></div><span class="send">↑</span></div></div>`;
function shell(content,id){const account=['account','binding','account-rules'].includes(id),task=['tasks','task-detail'].includes(id),dev=id==='dev',settings=['models','add-service'].includes(id);return `<div class="app" data-screen="${id}"><aside class="side"><a class="brand" href="#chat"><span class="brand-mark">乔</span><span><b>大乔</b><small>你的三谋个人助手</small></span></a><div><div class="section-label">通用</div><a class="agent-link ${!account&&!task&&!dev&&!settings?'active':''}" href="#chat"><span class="avatar">乔</span><span><span class="agent-name">大乔</span><span class="agent-meta">讨论、安排与总结</span></span></a></div><div><div class="section-label">我的账号</div><a class="agent-link ${account?'active':''}" href="#account"><span class="avatar">风</span><span><span class="agent-name">长风 · S1</span><span class="agent-meta">开荒中 · 已连接</span></span></a><a class="agent-link" href="#tasks"><span class="avatar">舟</span><span><span class="agent-name">云舟 · S2</span><span class="agent-meta">战斗准备 · 已连接</span></span></a><a class="agent-link muted" href="#binding"><span class="avatar">＋</span><span>添加账号</span></a></div><div class="side-bottom"><div>Windows · 本机运行</div><a href="#models">⚙ <span>设置</span></a></div></aside><section class="content"><header class="top"><span class="top-note">${settings?'设置':account?'长风 · S1':task?'我的任务':dev?'开发者模式':'和大乔聊聊'}</span><nav class="tabs"><a href="#chat" class="${!task&&!dev&&!settings?'active':''}">对话</a><a href="#tasks" class="${task?'active':''}">任务</a>${dev?'<a href="#dev" class="active">调试</a>':''}</nav><div class="top-right">${dev?'<span class="chip">Dev 已开启</span>':''}<a class="icon-btn" href="#models" aria-label="设置">⚙</a></div></header><main class="main">${content}</main><footer class="footer">设计样图 · 示例数据 · 不连接游戏或模型</footer></section></div>`;}
const pages={
chat:()=>`<div class="chat-wrap"><div class="chat-title"><div class="avatar">乔</div><h1>大乔</h1><small>懂游戏，也记得你的安排</small></div><div class="chat-date">今天 · 09:10（示例）</div><div class="bubble user">帮长风推进章节，云舟先整理今天的战斗准备。</div><div class="bubble"><p>好。长风继续开荒；云舟先检查队伍和已有战报，再整理需要你决定的事项。</p><a class="inline-task" href="#tasks"><span>长风 · 完成当前章节目标<br><small>沿用这个账号的资源规则</small></span><span class="status">进行中</span></a><a class="inline-task" href="#tasks"><span>云舟 · 整理战斗准备<br><small>先检查信息，再给出建议</small></span><span class="status">进行中</span></a></div><div class="bubble"><p>你也可以直接进入账号会话，查看细节或调整目标。重要进展我会在这里汇总。</p></div>${composer()}</div>`,
account:()=>`<div class="chat-wrap">${heading('长风 · S1','已绑定区服账号 · 当前处于开荒阶段',btn('账号规则','account-rules','small'))}<div class="bubble user">看一下现在卡在哪，再帮我安排下一步。</div><div class="bubble"><p>当前先处理章节所需的建筑条件。第二队阵容调整已追加，后续顺序会根据进度和你的指令安排。</p><a class="inline-task" href="#task-detail"><span>完成第三章任务</span><span class="status">进行中</span></a></div><div class="screen-view"><div class="screen-top"><span>游戏画面 <span class="muted">· 查看时自动刷新</span></span><span class="muted">放大　×</span></div><div class="image-placeholder">游戏截图占位<small>展示客户端真实截图，不重新绘制游戏地图</small></div><div class="note">示例：最新画面 · 关闭后停止预览刷新</div></div>${composer(true)}</div>`,
tasks:()=>`${heading('任务','按账号查看当前安排，点开任务查看过程。','<span class="chip">新任务通过聊天创建</span>')}<div class="plain-tabs"><span class="active">当前任务</span><a href="#brief">定时安排</a></div><div class="task-group"><div class="group-header"><span>长风 · S1</span><span class="group-count">2 项未完成</span></div><a class="task-row" href="#task-detail"><span>完成第三章任务<small>正在核对建筑升级后的章节状态</small></span><span class="status">进行中</span></a><a class="task-row" href="#task-detail"><span>调整第二队阵容<small>默认追加；执行顺序由 Agent 结合进度判断</small></span><span class="status wait">排队中</span></a></div><div class="task-group"><div class="group-header"><span>云舟 · S2</span><span class="group-count">1 项未完成</span></div><a class="task-row" href="#task-detail"><span>整理今天的战斗准备<small>有一处队伍调整需要你决定</small></span><span class="status wait">等你确认</span></a></div><div class="task-group"><div class="group-header"><span>大乔</span><span class="group-count">1 项定时</span></div><a class="task-row" href="#brief"><span>晚间总报<small>每天 22:00 · 长风、云舟（示例设置）</small></span><span class="status">已安排</span></a></div><div class="completed">› 已完成任务（折叠）</div>`,
'task-detail':()=>`${heading('完成第三章任务','长风 · S1　／　任务详情',btn('返回任务','tasks','small'))}<div class="two-col wide-left"><div class="panel"><div class="section-head"><h2>执行过程</h2><span class="chip"><i class="dot"></i>进行中</span></div><div class="timeline"><div class="step done"><b>查看当前章节与资源</b><time>09:12</time><p>已读取当前窗口，确认角色和章节目标。</p></div><div class="step done"><b>核对升级条件</b><time>09:13</time><p>查阅相关资料，检查现有资源是否满足条件。</p></div><div class="step done"><b>完成目标建筑升级</b><time>09:14</time><p>操作后重新查看画面，核对实际结果。</p></div><div class="step"><b>核对章节是否达成</b><time>现在</time><p>正在确认章节变化，不以模型的一句“完成”作为结果。</p></div></div><div class="empty-line"></div><div class="note">这里展示可读过程；详细模型调用与工具日志在 Dev 调试中查看。</div></div><div class="stack"><div class="panel"><h2>任务约定</h2><div class="summary-line"><span>目标</span><span>完成第三章</span></div><div class="summary-line"><span>保留资源</span><span>500 金铢（示例）</span></div><div class="summary-line"><span>当前安排</span><span>优先处理章节条件</span></div><div class="pill-row">${btn('暂停','tasks','soft small')}${btn('取消任务','tasks','small')}</div></div><div class="panel"><h2>步骤截图</h2><div class="image-placeholder">历史截图占位<small>09:14 · 建筑升级后（示例）</small></div><div class="note">按需展开对应步骤的截图，不是实时画面。</div></div></div></div>`,
models:()=>`${heading('设置','模型与服务')}<div class="settings-layout"><nav class="settings-menu"><a href="#models" class="active">模型与服务</a><span>通知<small>详细设置待评审</small></span><span>数据与存储<small>详细设置待评审</small></span><a href="#dev">开发者</a></nav><div class="stack"><div class="panel"><h2>自动分配模型</h2><div class="setting-row"><div>主力模型<small>理解目标、规划任务、选择模型</small></div><div class="field">云端主力 A（示例）<span>⌄</span></div></div><div class="setting-row"><div>备用主力<small>主力不可用时按规则接替</small></div><div class="field">云端备用 B（示例）<span>⌄</span></div></div><ul class="rule-list"><li>复杂规划由主力处理；简单整理优先交给轻量模型。</li><li>截图交给可理解图像的模型；行动优先使用已训练验证的 Qwen3.5-9B。</li><li>只选择已启用、能力匹配且符合预算和数据范围的模型。</li></ul></div><div class="panel"><div class="section-head"><h2>可用服务</h2>${btn('＋ 添加服务','add-service','soft small')}</div><div class="service-row"><span>我的云端接口<small>可接 Gemini、OpenAI、Grok、DeepSeek、GLM 等模型</small></span><span class="service-status">配置示例</span></div><div class="service-row"><span>本地模型服务<small>本机或局域网服务地址</small></span><span class="service-status">配置示例</span></div><div class="note">各模型记录具体版本、能力和验证结果。密钥不进入聊天和日志。</div></div></div></div>`,
'add-service':()=>`${heading('添加模型服务','一个接口配置一次，可以管理多个模型。',btn('返回设置','models','small'))}<div class="panel" style="max-width:800px;margin:auto"><div class="section-head"><h2>连接信息</h2><button class="btn soft small" type="button">导入 .env（示意）</button></div><div class="form-grid"><div class="form-item"><label>服务名称</label><div class="field">我的云端服务</div></div><div class="form-item"><label>服务位置</label><div class="field">云端 API <span>⌄</span></div></div><div class="form-item full"><label>API 地址</label><div class="field">https://api.example.com/v1</div></div><div class="form-item"><label>接口格式</label><div class="field">OpenAI 兼容接口（示例）<span>⌄</span></div></div><div class="form-item"><label>API Key</label><div class="field">••••••••　系统凭据占位</div></div></div><div class="empty-line"></div><div class="section-head"><h2>这个接口下的模型</h2><span class="muted" style="font-size:12px">获取列表／手动添加</span></div><div class="service-row"><span>chat-main（示例）</span><span class="service-status">未验证</span></div><div class="service-row"><span>vision-model（示例）</span><span class="service-status">未验证</span></div><div class="note">导入只预填，检查后保存。具体模型测试通过后，再加入自动分配。</div><div class="form-actions">${btn('返回','models')}${btn('保存配置','models','primary')}</div></div>`,
brief:()=>`<div class="chat-wrap"><div class="chat-title"><div class="avatar">乔</div><h1>大乔</h1><small>今天的事情，帮你收个尾</small></div><div class="brief-card"><div class="brief-title"><h2>今晚的账号小结</h2><small>22:00 · 晚间总报（示例）</small></div><div class="brief-account"><h3>长风 · S1</h3><p class="strong">今天完成章节前置与建筑升级。</p><p>第二队阵容调整尚未开始，明天继续检查队伍后安排。</p><p>资源变化与步骤记录可在对应任务里查看。</p><div class="brief-link"><a href="#task-detail">查看任务 →</a><a href="#account">进入账号会话 →</a></div></div><div class="brief-account"><h3>云舟 · S2</h3><p class="strong">战斗准备资料已整理，有一处队伍调整等你决定。</p><p>今晚未继续执行需要确认的安排。</p></div></div><div class="bubble user">明早 8 点再告诉我这两个账号分别先做什么。</div><div class="bubble"><p>好，早报安排好了。你也可以在任务页调整时间或暂停。</p><div class="meta"><a href="#tasks">查看定时安排 →</a></div></div>${composer()}</div>`,
dev:()=>`${heading('调试','按任务查看模型、检索和工具的详细运行记录。',btn('关闭 Dev','models','small'))}<div class="dev-banner">Dev 已开启 · 此页为技术记录视图，关闭后隐藏，不删除已有日志。</div><div class="two-col wide-left"><div class="panel"><h2>长风 · 完成第三章任务</h2><div class="trace-row"><span>09:14:02</span><span>读取当前游戏画面</span><span>完成</span></div><div class="trace-row"><span>09:14:03</span><span>检索章节与建筑资料</span><span>完成</span></div><div class="trace-row active"><span>09:14:04</span><span>策略模型提出下一步动作</span><span>已选中</span></div><div class="trace-row"><span>09:14:05</span><span>检查工具参数与账号约束</span><span>通过</span></div><div class="trace-row"><span>09:14:06</span><span>执行操作并核对结果</span><span>完成</span></div><div class="note">调用时间、结果均为示例。可关联原始请求、工具结果与 Trace。</div></div><div class="panel"><h2>本次调用</h2><div class="summary-line"><span>模型</span><span>Qwen3.5-9B · 示例版本</span></div><div class="summary-line"><span>类型</span><span>游戏行动</span></div><div class="summary-line"><span>关联任务</span><span>章节目标</span></div><div class="code">工具提议：upgrade_building<br><br>目标：章节要求的建筑<br>结果：已交给执行检查<br><br>调用编号、耗时与用量<br>由真实记录提供。</div><div class="note">不展示密钥，不生成隐藏思维过程。LangSmith 是可选关联视图。</div></div></div>`,
binding:()=>`${heading('添加账号','一个账号 Agent 固定对应一个区服账号。',btn('返回对话','chat','small'))}<div class="binding-panel"><div class="binding-steps"><span>选择游戏窗口</span><span>→</span><span class="current">核对区服与角色</span><span>→</span><span>完成绑定</span></div><div class="panel"><h2>选择已登录的游戏窗口</h2><div class="window-choice"><span class="radio"></span><span>三国：谋定天下 — 窗口 A<small>本机 Windows · 示例窗口</small></span><span class="chip">已选择</span></div><div class="image-placeholder" style="min-height:180px">账号识别截图占位<small>从所选游戏窗口读取区服、赛季与角色信息</small></div><div class="bound-info"><div><label>角色</label>长风（示例）</div><div><label>区服</label>S1 示例区服</div><div><label>账号 Agent 名称</label>长风 · S1</div></div><div class="note">信息不清楚时先补充核对；同一登录账号的不同区服分别绑定。</div><div class="form-actions">${btn('重新选窗口','binding')}${btn('确认绑定','account','primary')}</div></div></div>`,
'account-rules':()=>`${heading('账号规则','长风 · S1　／　也可以直接在这个账号的对话中修改。',btn('返回账号会话','account','small'))}<div class="panel" style="max-width:800px;margin:auto"><div class="rules-block"><div class="label">当前目标</div><p>优先推进章节，再整理第二队阵容。</p></div><div class="rules-block"><div class="label">执行规则</div><div class="rule-text">正常领奖、章节所需升级与补兵可以继续。<br>保留 500 金铢，不动这部分资源。<br>更换主力阵容前先问我。</div><div class="note">以上为示例规则；实际以你的约定为准。</div></div><div class="rules-block"><div class="label">如何调整</div><p>在对话里说“以后保留更多金铢”或“取消这条限制”，大乔会明确变更的内容与适用账号。</p></div><div class="form-actions">${btn('在对话中调整','account','primary')}</div></div>`
};
function render(){const id=location.hash.slice(1)||'chat';const page=paths.includes(id)?id:'chat';document.getElementById('root').innerHTML=shell(pages[page](),page);document.title='大乔设计样图 · '+page;}
window.addEventListener('hashchange',render);render();
</script></body></html>
