<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大乔 PRD v2 页面样图</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="mockups.css"><script src="lucide.js" defer></script></head>
<body><div id="root"></div>
<script>
const scenes=['chat','account','tasks','task-detail','models','add-service','brief','dev','binding','account-rules','scheduled','account-detail','developer','sync','sync-chat'];
const state={platform:location.hash.startsWith('#sync-chat')?'mac':'windows',dev:false,account:'wind',viewer:true,duplicate:false,reconnected:false,task:'running',effectPending:true,ruleDraft:false,ruleConfirmed:false,ruleVersion:3,reserve:500,scheduled:true,time:'22:00',syncOnline:true,signedIn:true,candidateTest:'unverified',candidateEnabled:false,primary:'cloud-main',backup:'cloud-backup',menu:false,feedback:'',messages:[],macMessages:[],serviceSaved:false};
const names={wind:'长风 · S1',cloud:'云舟 · S2'};
const statuses={queued:'排队中',running:'进行中',waiting:'等待中',approval:'待确认',paused:'已暂停',completed:'已完成',failed:'未完成',cancelled:'已取消'};
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const action=(text,key,cls='',attrs='')=>`<button type="button" class="button ${cls}" data-action="${key}" ${attrs}>${text}</button>`;
const link=(text,to,cls='')=>`<a class="button ${cls}" href="#${to}">${text}</a>`;
const badge=(text,cls='',glyph='')=>`<span class="badge ${cls}">${glyph?icon(glyph):''}${text}</span>`;
const heading=(title,description,actions='')=>`<div class="page-head"><div><h1>${title}</h1><p>${description}</p></div><div class="page-head-actions">${actions}</div></div>`;
const note=text=>`<div class="note">${text}</div>`;
const feedback=()=>`<div class="toast" data-feedback aria-live="polite">${esc(state.feedback)}</div>`;
const placeholder=(title,desc)=>`<div class="placeholder">${icon('image')}<span>${title}</span><small>${desc}</small></div>`;
const route=()=>{const [key,query]=location.hash.slice(1).split('?');return {id:scenes.includes(key)?key:'chat',query:new URLSearchParams(query||'')};};
function composer(mac=false,attachments=false){return `<div class="composer">${attachments?`<div class="attachments"><div class="attachment" data-attachment>${icon('image')}<span>阵容截图.png<small>对话参考 · 待发送</small></span><button class="icon-button" type="button" data-action="remove-attachment" aria-label="移除附件">${icon('x')}</button></div></div>`:''}<textarea data-compose aria-label="消息输入框" rows="2" placeholder="${mac?'继续聊策略、查资料；游戏操作请在 Windows 进行。':'和大乔聊聊，或粘贴文字、图片、文件…'}"></textarea><div class="composer-bottom"><button class="icon-button" type="button" data-action="attachment-demo" aria-label="添加附件">${icon('paperclip')}</button><span class="mode">模型：自动分配</span><button class="icon-button send" type="button" data-action="${mac?'mac-send':'send'}" aria-label="发送消息">${icon('arrow-up')}</button></div></div>`;}
function settingsNav(active){return `<nav class="settings-nav" aria-label="设置分类"><a href="#models" class="${active==='models'?'active':''}">模型与服务</a><a href="#sync" class="${active==='sync'?'active':''}">账户与同步</a><a href="#developer" class="${active==='developer'?'active':''}">开发者</a><span class="pending-nav">通知<small>细节待评审</small></span><span class="pending-nav">数据与存储<small>保留策略待评审</small></span></nav>`;}
function shell(content,id){const isMac=state.platform==='mac';const isAccount=['account','account-detail','account-rules','sync-chat'].includes(id),task=['tasks','task-detail','scheduled'].includes(id),settings=['models','add-service','developer','sync'].includes(id),debug=id==='dev';const showDev=state.dev||debug;return `<div class="app ${state.menu?'menu-open':''}" data-screen="${id}"><aside class="sidebar"><a class="brand" href="#chat"><span class="brand-mark">乔</span><span><strong>大乔</strong><small>你的三谋个人助手</small></span></a><div><div class="nav-label">通用</div><a class="agent ${!isAccount&&!task&&!settings&&!debug?'active':''}" href="#chat"><span class="avatar">乔</span><span><strong>大乔</strong><small>讨论、安排与总结</small></span></a></div><div><div class="nav-label">我的账号会话</div>${[['wind','风','长风 · S1'],['cloud','舟','云舟 · S2']].map(([key,glyph,name])=>`<a class="agent ${isAccount&&state.account===key?'active':''}" href="#${isMac?'sync-chat':'account'}?agent=${key}" data-agent="${key}"><span class="avatar">${glyph}</span><span><strong>${name}</strong><small>${isMac?'记录已同步 · 可续聊':'Windows · 已绑定'}</small></span></a>`).join('')}${!isMac?`<a class="agent" href="#binding"><span class="avatar">${icon('plus')}</span><span>添加账号</span></a>`:''}</div><div class="side-bottom"><span>${isMac?'Mac · 仅续聊，不远程执行':'Windows · 本机游戏执行'}</span><a href="#sync">${icon('cloud')}<span>${!state.signedIn?'需要登录':state.syncOnline?'聊天记录已同步':'离线 · 等待同步'}</span></a><a href="#models">${icon('settings')}<span>设置</span></a></div></aside><section class="workspace"><header class="topbar"><button type="button" class="icon-button mobile-toggle" data-action="menu" aria-label="打开会话导航">${icon('menu')}</button><span class="top-label">${settings?'设置':task?'任务':debug?'开发者模式':id==='binding'?'添加账号':isAccount?names[state.account]:'和大乔聊聊'}</span><nav class="tabs" aria-label="主要页面"><a href="#chat" ${!task&&!settings&&!debug?'aria-current="page"':''}>对话</a><a href="#tasks" ${task?'aria-current="page"':''}>任务</a>${showDev?`<a href="#dev" ${debug?'aria-current="page"':''}>调试</a>`:''}</nav><div class="top-actions"><a href="#sync" class="sync-mini">${icon(!state.signedIn?'log-in':state.syncOnline?'cloud-check':'cloud-off')}<span>${!state.signedIn?'需要登录':state.syncOnline?'已同步':'待同步'}</span></a><a class="icon-button" href="#models" aria-label="设置">${icon('settings')}</a></div></header><main class="content">${content}${feedback()}</main><footer class="footer">大乔 PRD v2 · 设计示例 · 不连接模型、同步服务或游戏</footer></section></div>`;}
const pages={
chat:()=>`<div class="chat"><div class="chat-title"><span class="avatar">乔</span><div><h1>大乔</h1><small>了解你的目标，也记得每个账号的安排</small></div></div><div class="chat-time">今天 · 09:10（示例）</div><div class="message user">帮长风推进章节，云舟先整理战斗准备。</div><div class="message"><p>好。两项任务分别处理，结果会在这里汇总。</p><a class="inline-task" href="#task-detail"><span>长风 · 完成第三章任务<small>已收到目标，按账号规则推进</small></span>${badge('进行中')}</a><a class="inline-task" href="#tasks"><span>云舟 · 整理战斗准备<small>资料已整理，队伍调整需要你决定</small></span>${badge('待确认','warning')}</a></div><div class="message"><p>云舟的队伍调整需要你确认。这个问题属于刚才的安排，会保留在当前会话；账号会话中也能找到任务引用。</p>${link('查看这项确认','task-detail','sm')}</div>${state.messages.map(m=>`<div class="message user">${esc(m)}</div>`).join('')}${composer()}</div>`,
account:()=>`<div class="chat">${heading(names[state.account],'Windows · 绑定已核验 · 独立账号会话',action(icon('monitor')+(state.viewer?'收起画面':'游戏画面'),'toggle-viewer','sm')+link('账号详情与规则','account-detail','sm'))}<div class="message user">看一下当前进度，后面再调整第二队。</div><div class="message"><p>新任务已追加。先处理章节条件，后续顺序会结合进度、任务依赖和你的指令安排。</p><a class="inline-task" href="#task-detail"><span>完成第三章任务<small>问题和结果关联到原会话</small></span>${badge('进行中')}</a></div>${state.viewer?`<div class="viewer" data-viewer><div class="viewer-head"><span>当前游戏画面</span><div class="actions"><button class="icon-button" data-action="viewer-enlarge" aria-label="放大画面">${icon('maximize-2')}</button><button class="icon-button" data-action="toggle-viewer" aria-label="关闭画面">${icon('x')}</button></div></div>${placeholder('游戏截图占位','实际客户端截图；本页不绘制地图或虚构游戏画面')}<div class="note">采集于 09:14:06（示例）· 打开时最多 1 帧／秒，关闭即停止 · 预览不调用模型</div></div>`:''}${composer(false,true)}</div>`,
tasks:()=>`${heading('任务','模型决定安排顺序，程序核对并提交；新任务默认追加。',link(icon('calendar-clock')+'定时安排','scheduled','sm'))}<div class="task-group"><div class="task-group-head"><span>长风 · S1</span><span>2 项待处理</span></div><a class="task-row" href="#task-detail"><span>完成第三章任务<small>正在核对升级结果</small></span><span class="task-status">进行中</span></a><a class="task-row" href="#task-detail"><span>调整第二队阵容<small>已追加，不打断当前未核清的操作</small></span><span class="task-status">排队中</span></a></div><div class="task-group"><div class="task-group-head"><span>云舟 · S2</span><span>1 项待处理</span></div><a class="task-row" href="#task-detail"><span>整理战斗准备<small>确认问题在原大乔会话中，账号会话保留引用</small></span><span class="task-status pending">待确认</span></a></div><div class="panel"><div class="section-head"><h2>多账号安排</h2>${badge('部分完成')}</div><p>“晨间检查”示例：长风已完成，云舟仍需确认。总任务不会提前显示全部完成。</p><div class="actions">${link('回原会话','chat','sm')}${action('取消未结束的子任务','cancel-group','sm danger')}</div><div class="note" style="margin-top:12px">定时计划不计入“待处理任务”；每次触发产生独立运行记录。</div></div>`,
'task-detail':()=>`${heading('完成第三章任务',names[state.account]+' · 任务详情',link('返回任务','tasks','sm'))}<div class="columns"><div class="panel"><div class="section-head"><h2>执行过程</h2>${badge(statuses[state.task],state.task==='cancelled'?'neutral':'')}</div>${state.effectPending?`<div class="banner warning">${icon('circle-alert')}<div>结果待核对<br><span class="note">输入可能已送出，暂不重发或开始新的游戏变更。</span></div></div>`:`<div class="banner success">${icon('circle-check')}已核对实际效果；取消终态保持不变。</div>`}<div class="timeline"><div class="step"><strong>读取当前角色与章节</strong><time>09:12</time><p>窗口身份与目标已核对。</p></div><div class="step"><strong>检查规则和资源</strong><time>09:13</time><p>使用规则 v${state.ruleVersion}，保留 ${state.reserve} 金铢（示例）。</p></div><div class="step"><strong>发送升级操作</strong><time>09:14</time><p>已记录本次意图，后帧回执尚待核清。</p></div><div class="step"><strong>核对实际效果</strong><p>仅检查已发生的结果，不重新升级。</p></div></div><div class="actions" style="margin-top:20px">${action('演示核对完成','resolve-effect','sm')}</div></div><div class="stack"><div class="panel"><h2>任务信息</h2><div class="summary-row"><span>目标</span><span>完成第三章</span></div><div class="summary-row"><span>暂停原因</span><span>${state.task==='paused'?'用户暂停':'无'}</span></div><div class="summary-row"><span>实际行动模型</span><span>Qwen3.5-9B · 示例版本</span></div><div class="actions" style="margin-top:16px">${action('暂停','pause-task','sm',state.task==='cancelled'?'disabled':'')}${action('继续','resume-task','sm',state.effectPending||state.task==='cancelled'?'disabled':'')}${action('取消','cancel-task','sm danger',state.task==='cancelled'?'disabled':'')}</div><div class="note" style="margin-top:12px">取消停止后续推进，不抹去已发生效果；继续前重新检查条件。</div></div><div class="panel"><h2>问题与证据</h2><p class="note">需要用户决定的问题回到原会话，不因当前查看位置改变归属。</p>${link('回到大乔会话','chat','sm')}${placeholder('步骤截图占位','09:14 · 与本次操作关联的历史截图')}</div></div></div>`,
models:()=>`${heading('设置','模型与服务 · 主力和备用由你指定，其余调用按规则分配。')}<div class="settings-layout">${settingsNav('models')}<div class="stack"><div class="panel"><h2>主力与备用</h2><div class="field-grid"><label class="field">主力模型<select data-primary><option value="cloud-main">云端主力 A（已启用）</option>${state.candidateEnabled?'<option value="chat-fast">chat-fast（已启用）</option>':''}</select></label><label class="field">备用主力<select><option>云端备用 B（已启用）</option></select></label></div><p class="note" style="margin-top:16px">只显示所需能力已验证且已启用的候选。主力选择不改变游戏行动的发布准入。</p></div><div class="panel"><div class="section-head"><h2>我的云端服务</h2>${link(icon('plus')+'添加服务','add-service','sm')}</div><div class="model-row"><div><h3>cloud-main ${badge('主力')}</h3><div class="capabilities"><span class="cap ok">文本通过</span><span class="cap ok">工具通过</span><span class="cap no">视觉未测</span></div><p>已启用 · 验证绑定服务、模型与配置版本。</p></div><div>${badge('已验证','success')}</div></div><div class="model-row" data-candidate><div><h3>chat-fast</h3><div class="capabilities"><span class="cap ${state.candidateTest==='passed'?'ok':'no'}">文本${state.candidateTest==='passed'?'通过':'未测'}</span><span class="cap ${state.candidateTest==='passed'?'ok':'no'}">工具${state.candidateTest==='passed'?'通过':'未测'}</span><span class="cap no">视觉未测</span></div><p>${state.candidateTest==='testing'?'正在测试（示例）':state.candidateTest==='passed'?'技术能力已验证；游戏行动尚未准入。':'未验证，暂不参加自动分配。'}</p></div><div class="model-actions">${action(state.candidateTest==='testing'?'测试中…':'测试模型','test-model','sm',state.candidateTest==='testing'?'aria-busy="true" aria-disabled="true"':'')}<label class="check-label"><input type="checkbox" data-enable-model ${state.candidateEnabled?'checked':''} ${state.candidateTest!=='passed'?'disabled':''}>启用</label>${action('设为主力','set-primary','sm',!state.candidateEnabled?'disabled':'')}</div></div><div class="model-row"><div><h3>Qwen3.5-9B · 游戏策略</h3><div class="capabilities"><span class="cap ok">工具格式通过（示例）</span><span class="cap no">行动评测待完成</span></div><p>行动资格来自固定任务评测及发布记录，不由接口小测试授予。</p></div><div>${badge('待准入','neutral')}</div></div><div class="note">修改协议、模型或相关部署配置后验证失效；数据允许范围和费用额度在配置中明确后才可分配。</div></div></div></div>`,
'add-service':()=>`${heading('添加模型服务','手动填写或导入 .env 预填；同一接口可提供多个模型。',link('返回设置','models','sm'))}<div class="panel" style="max-width:800px;margin:auto"><div class="section-head"><h2>连接信息</h2>${action(icon('file-input')+'导入示例配置','import-service','sm')}</div><div class="field-grid"><label class="field">服务名称<input type="text" data-service-name value="我的云端服务"></label><label class="field">服务位置<select data-service-location><option value="cloud">云端 API</option><option value="local">本机／局域网</option></select></label><label class="field full">API 地址<input type="text" data-service-url value="https://api.example.com/v1"></label><label class="field">接口格式<select><option>OpenAI 兼容（示例）</option><option>其他适配协议</option></select></label><label class="field">API Key<input type="text" readonly value="凭据占位，不接受真实密钥"></label></div><div class="subtle-line"></div><div class="section-head"><h2>具体模型</h2><span class="note">获取列表或手动添加</span></div><div class="summary-row"><span>chat-fast（示例）</span>${badge('未验证','neutral')}</div><p class="note">导入只解析支持的配置字段，不执行脚本；检查后保存。模型能力测试和启用在保存后完成。</p><div class="actions end">${action(state.serviceSaved?'已保存示意':'保存配置','save-service','primary')}${link('测试和启用模型','models')}</div></div>`,
brief:()=>`<div class="chat"><div class="chat-title"><span class="avatar">乔</span><div><h1>大乔</h1><small>晚间总报 · 22:00（示例）</small></div></div><div class="panel"><h2>今天的账号小结</h2><h3>长风 · S1</h3><p>章节前置已完成，第二队阵容调整还未开始。</p><p class="note">已完成与未完成分别记账；资源变化可以从对应任务核对。</p><div class="subtle-line"></div><h3>云舟 · S2</h3><p>战斗准备资料已整理，一处队伍调整仍等你确认。</p><p class="note">没有批准的操作没有继续执行。</p><div class="actions">${link('查看任务','tasks','sm')}${link('管理这份定时简报','scheduled','sm')}</div></div><div class="message user">明早再告诉我两个账号分别先做什么。</div><div class="message">可以。早报会列出建议和待决定项，不会把计划自动变成新的游戏执行授权。</div>${composer()}</div>`,
dev:()=>`${heading('调试','仅在 Dev 开启时显示；日志与业务账本分开。',link('开发者设置','developer','sm'))}<div class="banner">${icon('bug')}Dev 已开启（此样图）· 关闭仅隐藏入口，不删除记录。</div><div class="columns"><div class="panel"><h2>长风 · 第三章任务</h2>${[['09:14:02','读取绑定窗口画面','完成'],['09:14:03','查找章节知识','完成'],['09:14:04','模型提出动作','已记录'],['09:14:05','检查规则和输入权','通过'],['09:14:06','动作后结果核对','未决']].map(([time,title,status])=>`<div class="trace"><time>${time}</time><span>${title}</span><span>${status}</span></div>`).join('')}<p class="note" style="margin-top:16px">任务、步骤、模型调用、证据引用由关联编号串起；这里不补造隐藏思维过程。</p></div><div class="panel"><h2>当前记录</h2><div class="code">model: Qwen3.5-9B<br>model_revision: 示例版本<br>actor_origin: policy<br>tool: upgrade_building<br>effect: unknown<br>dispatch: 暂停新变更</div><p class="note" style="margin-top:16px">密钥、游戏凭据不写入日志。LangSmith 仅接收获准的观测副本。</p></div></div>`,
binding:()=>`${heading('添加账号','选择已登录游戏窗口，核对身份后再建立固定绑定。',link('返回对话','chat','sm'))}<div class="panel" style="max-width:800px;margin:auto"><h2>选择游戏窗口</h2><label class="check-label"><input type="radio" checked name="window">三国：谋定天下 — 窗口 A（示例）</label>${placeholder('身份识别截图占位','读取可信登录身份引用、区服和角色标识；昵称仅用于展示')}<div class="summary-row"><span>识别角色</span><span>长风 · S1（示例）</span></div><div class="summary-row"><span>核验状态</span><span>${state.duplicate?'已识别已有绑定':'等待核对'}</span></div>${state.duplicate?`<div class="banner warning">${icon('users')}此区服角色已绑定“长风 · S1”，不新建第二个 Agent 或执行队列。</div><div class="actions">${link('进入已有 Agent','account','primary')}${link('重新连接窗口','account-detail')}</div>`:`<div class="actions end">${action('核对身份与重复绑定','check-binding','primary')}</div>`}<p class="note" style="margin-top:16px">这是重复绑定场景示例。不读取密码，也不会实际连接窗口。</p></div>`,
'account-detail':()=>`${heading('账号详情与规则',names[state.account]+' · 一个 Agent 对应一个区服角色',link('返回账号会话','account','sm'))}<div class="columns"><div class="panel"><div class="section-head"><h2>游戏连接</h2>${badge(state.reconnected?'已重新核验':'需要重新连接',state.reconnected?'success':'warning')}</div><div class="summary-row"><span>账号身份引用</span><span>个人账号 A（脱敏示例）</span></div><div class="summary-row"><span>区服／角色</span><span>${names[state.account]}</span></div><div class="summary-row"><span>绑定修订</span><span>${state.reconnected?'r4':'r3'}（示例）</span></div><div class="summary-row"><span>窗口状态</span><span>${state.reconnected?'已连接新窗口':'原窗口已失效'}</span></div><div class="actions" style="margin-top:16px">${action('重新核对窗口','reconnect','primary')}</div><p class="note" style="margin-top:16px">旧窗口引用与旧绑定修订失效后，不继续派发；重连沿用已有会话和任务。</p></div><div class="panel"><h2>账号规则</h2><p>保留 ${state.reserve} 金铢，主力阵容变更前确认。</p><p class="note">规则 v${state.ruleVersion} · 目标、额度、范围独立保存。</p>${link('查看和修改规则','account-rules')}<div class="subtle-line"></div><h3>共享记录</h3><p class="note">聊天可同步到你的其他设备。Mac 可以续聊，不获得本机游戏执行权限。</p>${link('查看同步设置','sync','sm')}</div></div>`,
'account-rules':()=>`${heading('账号规则',names[state.account]+' · 规则 v'+state.ruleVersion,link('返回账号详情','account-detail','sm'))}<div class="panel" style="max-width:800px;margin:auto"><div class="rule-item"><strong>资源约束</strong><p>保留 ${state.reserve} 金铢，不使用预留部分。</p><span class="note">结构化值：资源＝金铢；最低保留＝${state.reserve}；范围＝当前区服账号。</span></div><div class="rule-item"><strong>确认要求</strong><p>更换主力阵容前先确认；现有高风险操作确认要求保留。</p></div>${state.ruleDraft?`<div class="rule-item"><h3>确认这次规则变更</h3><div class="diff"><div><small>当前 v${state.ruleVersion}</small><strong>保留 ${state.reserve} 金铢</strong></div><div><small>拟更新</small><strong>保留 700 金铢</strong></div></div><p class="note">收紧后，旧许可失效；后续变更输入前按新规则检查。不满足的任务暂停，不补满预算。</p><label class="check-label"><input type="checkbox" data-confirm-rule ${state.ruleConfirmed?'checked':''}>确认只修改 ${names[state.account]} 的这条规则</label><div class="actions">${action('确认并生效','apply-rule','primary',!state.ruleConfirmed?'disabled':'')}${action('取消变更','discard-rule')}</div></div>`:`<div class="actions">${action('演示把预留提高到 700','propose-rule')}${link('在账号对话中调整','account','ghost')}</div>`}<div class="subtle-line"></div><details><summary>版本记录</summary><p class="note">v${state.ruleVersion}：保留 ${state.reserve} 金铢；本页变更只在演示状态中保存。放宽规则必须明确确认，不自动扩大旧任务授权。</p></details></div>`,
scheduled:()=>`${heading('晚间总报','任务 · 定时安排详情',link('返回任务','tasks','sm'))}<div class="columns"><div class="panel"><div class="section-head"><h2>定时计划</h2>${badge(state.scheduled?'已启用':'已停用',state.scheduled?'success':'neutral')}</div><div class="field-grid"><label class="field">发送时间（示例）<input type="time" data-schedule-time value="${state.time}"></label><label class="field">统计账号<input type="text" readonly value="长风 · S1、云舟 · S2"></label></div><div class="summary-row"><span>频率</span><span>每天 · 示例计划</span></div><div class="summary-row"><span>发送位置</span><span>原大乔会话</span></div><div class="actions" style="margin-top:16px">${action('保存时间示意','save-schedule','primary')}${action(state.scheduled?'停用计划':'恢复计划','toggle-schedule')}${link('在对话中调整','chat','ghost')}</div><p class="note" style="margin-top:16px">停用阻止后续触发，不删除已生成简报；计划与每次运行分别记录。</p></div><div class="panel"><h2>最近一次运行</h2><div class="summary-row"><span>触发时间</span><span>昨天 22:00（示例）</span></div><div class="summary-row"><span>结果</span><span>已发送</span></div>${link('查看已生成简报','brief')}<div class="subtle-line"></div><p class="note">时区、错过触发和应用退出后的行为仍待评审。此页不会创建真实定时任务。</p></div></div>`,
developer:()=>`${heading('设置','开发者设置')}<div class="settings-layout">${settingsNav('developer')}<div class="panel"><h2>开发者模式</h2><div class="toggle-row"><div><strong>Dev 调试</strong><small>显示模型调用、工具结果和关联 Trace</small></div><label class="switch"><input type="checkbox" data-dev ${state.dev?'checked':''} role="switch" aria-label="Dev调试"><span>${state.dev?'已开启':'已关闭'}</span></label></div><p class="note">默认关闭。关闭只隐藏调试入口，不删除已有日志；正常任务过程一直可以查看。</p>${state.dev?link('进入调试','dev','primary'):''}<div class="subtle-line"></div><p class="note">模型密钥不写入日志；账户与同步凭据也不写入 Trace。采集、脱敏和 LangSmith 配置细项另行评审。</p></div></div>`,
sync:()=>`${heading('设置','账户与同步 · 同一大乔用户，不等于游戏登录账号。')}<div class="settings-layout">${settingsNav('sync')}<div class="stack"><div class="panel"><div class="section-head"><h2>我的个人空间</h2>${badge(state.signedIn?'已登录（示例）':'需要登录',state.signedIn?'success':'warning')}</div><p>在自己的 Windows 和 Mac 上使用同一大乔身份，查看同一组会话和消息。</p><div class="actions">${action(state.signedIn?'演示退出登录':'演示登录','toggle-login')}${link('查看 Mac 续聊样图','sync-chat')}</div><p class="note" style="margin-top:12px">具体登录服务与密钥托管方案留待技术设计；本页不收集账号密码。</p></div><div class="panel"><div class="section-head"><h2>聊天同步</h2>${badge(!state.signedIn?'需要登录':state.syncOnline?'已同步':'离线待上传',state.signedIn&&state.syncOnline?'success':'warning')}</div><div class="device-row">${icon('monitor')}<div><strong>我的 Windows</strong><p>游戏执行端 · 上次同步 21:42（示例）</p></div>${badge('当前设备')}</div><div class="device-row">${icon('laptop')}<div><strong>我的 Mac</strong><p>可查看和续聊 · 不远程操作游戏</p></div>${badge('已授权设备','neutral')}</div><div class="actions" style="margin-top:16px">${action(state.syncOnline?'演示离线':'重试同步','toggle-sync')}${action('演示同步失败','sync-failure')}</div><div class="note" style="margin-top:12px">离线消息留在本机待上传；服务确认接收后才显示已同步，重试不重复生成消息或回复。</div></div><div class="panel"><h2>同步哪些内容</h2><ul class="list"><li>大乔与账号会话、消息、获准附件引用和任务结果卡。</li><li>附件按需下载，原始运行截图、游戏账本与实时画面不默认同步。</li><li>模型 Key、游戏凭据、执行许可与本机路径不随聊天同步。</li></ul></div></div></div>`,
'sync-chat':()=>`<div class="chat">${heading(names[state.account],'Mac · 聊天记录同步，可续聊，不远程执行',link('账户与同步','sync','sm'))}<div class="banner">${icon('cloud-check')}与 Windows 使用同一会话。任务卡只读，消息同步不会授予游戏执行权限。</div><div class="message"><p>Windows 上的章节任务正在核对结果。</p><div class="inline-task"><span>完成第三章任务<small>执行端：我的 Windows · 结果卡同步于 21:42（示例）</small></span>${badge('进行中')}</div></div><div class="message user">那先帮我分析第二队的配队思路。</div><div class="message">可以继续讨论策略与资料。涉及升级、批准操作或修改 Windows 生效规则的请求，会留为未执行建议，请在 Windows 继续。</div><div class="message"><div class="attachment">${icon('file-text')}<span>开荒笔记.md<small data-download-status>附件未下载</small></span>${action('下载示意','download-attachment','sm')}</div></div>${state.macMessages.map(m=>`<div class="message user">${esc(m.text)}<div class="note">${m.synced?'已同步':'离线待上传 · Agent 尚未读取'}</div></div>${m.synced?'<div class="message">这条消息已同步；涉及游戏操作的内容仅作为未执行建议，请在 Windows 继续。</div>':''}`).join('')}${composer(true)}</div>`
};
const windowsOnlyActions=new Set(['check-binding','reconnect','pause-task','resume-task','cancel-task','cancel-group','resolve-effect','propose-rule','apply-rule','discard-rule','toggle-schedule','save-schedule']);
function render(){const focused=document.activeElement;const focusAction=focused?.getAttribute('data-action');const focusControl=['data-enable-model','data-confirm-rule','data-dev','data-primary'].find(a=>focused?.hasAttribute(a));const r=route();if(r.id==='sync-chat')state.platform='mac';if(r.query.has('agent'))state.account=r.query.get('agent')==='cloud'?'cloud':'wind';let content=pages[r.id]();if(state.platform==='mac'){
 if(r.id==='account')content=pages['sync-chat']();
 if(r.id==='binding')content=heading('账号绑定','仅 Windows 可以核对游戏窗口。')+'<div class="banner">'+icon('monitor')+'请在 Windows 添加或重新连接游戏账号；Mac 仅查看同步会话。</div>'+link('返回账号会话','sync-chat');
 if(['tasks','task-detail','scheduled','account-detail','account-rules'].includes(r.id))content='<div class="banner">'+icon('eye')+'来自 Windows 的同步记录 · 更新于 21:42（示例） · 此设备只读，请在 Windows 执行或更改规则。</div>'+content;
 if(['models','add-service'].includes(r.id))content='<div class="banner">'+icon('laptop')+'这些模型设置仅用于 Mac 本机续聊，不修改 Windows 的游戏执行配置。</div>'+content;
 }
 document.getElementById('root').innerHTML=shell(content,r.id);document.title='大乔 PRD v2 · '+r.id;
 document.querySelector('[data-primary]')&&(document.querySelector('[data-primary]').value=state.primary);
 if(state.platform==='mac'){
  document.querySelectorAll('[data-action]').forEach(button=>{if(windowsOnlyActions.has(button.dataset.action)){button.disabled=true;button.setAttribute('aria-disabled','true');button.setAttribute('title','请在 Windows 操作');}});
  document.querySelectorAll('[data-confirm-rule],[data-schedule-time]').forEach(input=>{input.disabled=true;});
 }
 window.lucide?.createIcons({attrs:{width:20,height:20,'stroke-width':2}});
 if(focusAction){const next=[...document.querySelectorAll('[data-action]')].find(e=>e.dataset.action===focusAction);if(next&&!next.disabled)next.focus({preventScroll:true});}else if(focusControl){document.querySelector('['+focusControl+']')?.focus({preventScroll:true});}
}
function say(text){state.feedback=text;const node=document.querySelector('[data-feedback]');if(node)node.textContent=text;}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const key=target.dataset.action;if(state.platform==='mac'&&windowsOnlyActions.has(key)){say('Mac 只查看和续聊；本机没有批准、修改或派发 Windows 游戏操作。');return;}if(target.disabled||target.getAttribute('aria-disabled')==='true')return;switch(key){
case'menu':state.menu=!state.menu;render();break;
case'toggle-viewer':state.viewer=!state.viewer;render();break;
case'viewer-enlarge':say('放大交互示意；此处没有实际游戏截图。');break;
case'attachment-demo':say('附件入口示意：支持图片和文件；不会读取本机文件。');break;
case'remove-attachment':target.closest('[data-attachment]').remove();say('已从草稿移除示例附件。');break;
case'send':{const input=document.querySelector('[data-compose]');if(!input.value.trim()){say('请输入消息，或添加附件。');break;}state.messages.push(input.value.trim());state.feedback=state.platform==='mac'?'续聊示意完成，未创建或批准 Windows 游戏任务。':'发送示意完成，未调用模型。';render();break;}
case'mac-send':{const input=document.querySelector('[data-compose]');if(!input.value.trim()){say('请输入要续聊的内容。');break;}if(!state.signedIn){say('请先登录同一大乔账户。');break;}state.macMessages.push({text:input.value.trim(),synced:state.syncOnline});state.feedback='仅更新聊天示例，没有创建、批准或修改 Windows 游戏任务。';render();break;}
case'check-binding':state.duplicate=true;render();break;
case'reconnect':state.reconnected=true;state.feedback='重连示意完成：沿用原 Agent，绑定修订已更新。';render();break;
case'pause-task':state.task='paused';render();break;
case'resume-task':if(!state.effectPending&&state.task!=='cancelled'){state.task='running';render();}break;
case'cancel-task':state.task='cancelled';state.feedback='任务已取消；仍保留未决效果，禁止重放。';render();break;
case'resolve-effect':state.effectPending=false;state.feedback='核对示意完成；若任务已取消，不翻转其终态。';render();break;
case'cancel-group':say('总取消示意：只取消尚未结束的子任务，保留已发生的结果。');break;
case'propose-rule':state.ruleDraft=true;state.ruleConfirmed=false;render();break;
case'discard-rule':state.ruleDraft=false;render();break;
case'apply-rule':if(state.ruleConfirmed){state.reserve=700;state.ruleVersion++;state.ruleDraft=false;state.feedback='规则收紧示意：旧许可失效，下一次变更前重新检查。';render();}break;
case'test-model':state.candidateTest='testing';render();setTimeout(()=>{state.candidateTest='passed';state.feedback='文本／工具能力测试示意通过；未授予游戏行动资格。';render();},500);break;
case'set-primary':if(state.candidateEnabled){state.primary='chat-fast';state.feedback='主力选择已在演示中更新，游戏 Actor 配置不变。';render();}break;
case'import-service':document.querySelector('[data-service-name]').value='从 .env 预填的服务（示例）';say('已演示预填；没有读取 .env、密钥或执行任何脚本。');break;
case'save-service':state.serviceSaved=true;state.feedback='配置保存示意完成，模型仍需测试后手动启用。';render();break;
case'toggle-schedule':state.scheduled=!state.scheduled;render();break;
case'save-schedule':state.time=document.querySelector('[data-schedule-time]').value||state.time;state.feedback='时间修改仅在本页示例中生效，没有创建实际定时任务。';render();break;
case'toggle-sync':state.syncOnline=!state.syncOnline;if(state.syncOnline)state.macMessages.forEach(m=>{m.synced=true;});state.feedback=state.syncOnline?'补传示意完成：消息按原 ID 去重，不触发游戏操作。':'离线示意：新消息只保存在本机，不宣称已被 Agent 读取。';render();break;
case'sync-failure':state.syncOnline=false;state.feedback='同步失败示意：历史仍可查看，待上传内容保留，可重试。';render();break;
case'toggle-login':state.signedIn=!state.signedIn;state.feedback=state.signedIn?'登录状态示意，不进行真实认证。':'已退出示意：停止新同步，不影响 Windows 已发生的游戏结果。';render();break;
case'download-attachment':document.querySelector('[data-download-status]').textContent='下载完成（示例）';say('附件下载交互示意，没有访问文件服务。');break;
}});
document.addEventListener('change',event=>{const target=event.target;if(state.platform==='mac'&&target.matches('[data-confirm-rule],[data-schedule-time]')){say('此设备不能更改 Windows 的执行规则或定时计划。');return;}if(target.matches('[data-enable-model]')){state.candidateEnabled=state.candidateTest==='passed'&&target.checked;if(!state.candidateEnabled&&state.primary==='chat-fast')state.primary='cloud-main';render();}if(target.matches('[data-confirm-rule]')){state.ruleConfirmed=target.checked;render();}if(target.matches('[data-dev]')){state.dev=target.checked;render();}if(target.matches('[data-primary]')){state.primary=target.value;say('主力配置变更示意，不修改正在运行的游戏策略。');}if(target.matches('[data-service-location]'))document.querySelector('[data-service-url]').value=target.value==='local'?'http://127.0.0.1:8000/v1':'https://api.example.com/v1';});
window.addEventListener('hashchange',()=>{state.feedback='';state.menu=false;render();});window.addEventListener('DOMContentLoaded',render);
</script></body></html>
